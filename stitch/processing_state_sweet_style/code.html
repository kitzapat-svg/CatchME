<!DOCTYPE html><html lang="th"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Processing State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "bg-surface-subtle": "#FFEBF0",
                        "on-tertiary-fixed": "#00210b",
                        "surface-dim": "#d0daf0",
                        "surface-bright": "#f9f9ff",
                        "inverse-primary": "#ffb1c2",
                        "error-container": "#ffdad6",
                        "primary": "#9b3f5a",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#001d32",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f0f3ff",
                        "on-surface": "#121c2c",
                        "surface-variant": "#d9e3f9",
                        "primary-hover": "#FB6F92",
                        "bg-primary": "#FFF8F9",
                        "success": "#72EFDD",
                        "tertiary-fixed": "#9cf6ae",
                        "tertiary-container": "#6bc380",
                        "on-tertiary-fixed-variant": "#005225",
                        "on-primary-container": "#79243f",
                        "warning": "#FFD166",
                        "surface": "#f9f9ff",
                        "secondary-light": "#BDE0FE",
                        "surface-tint": "#9b3f5a",
                        "inverse-on-surface": "#ebf1ff",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#273141",
                        "secondary-fixed-dim": "#9bcbf8",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#d9e3f9",
                        "surface-container-high": "#dee8ff",
                        "surface-container": "#e7eeff",
                        "on-primary-fixed": "#3f0018",
                        "secondary-fixed": "#cde5ff",
                        "tertiary": "#056d34",
                        "tertiary-fixed-dim": "#81da94",
                        "primary-fixed": "#ffd9e0",
                        "on-primary-fixed-variant": "#7d2742",
                        "on-secondary-container": "#265a81",
                        "background": "#f9f9ff",
                        "primary-container": "#ff8fab",
                        "outline": "#877275",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary-container": "#a1d1fe",
                        "on-secondary-fixed-variant": "#104a70",
                        "on-background": "#121c2c",
                        "border-subtle": "#FFE0E6",
                        "secondary": "#30628a",
                        "primary-fixed-dim": "#ffb1c2",
                        "outline-variant": "#dac0c4",
                        "on-tertiary-container": "#004f23",
                        "on-surface-variant": "#544245"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "xs": "8px",
                        "xl": "32px",
                        "sm": "12px",
                        "lg": "24px",
                        "md": "16px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-bg-primary text-on-surface h-screen w-full flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden"><header class="absolute top-0 left-0 w-full p-margin-mobile flex items-center justify-center z-20">
    <span class="font-headline-sm text-primary font-bold">CatchME</span>
</header>
<!-- Ambient Background Elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[60vw] h-[60vw] rounded-full bg-primary-container opacity-20 blur-[80px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[80vw] h-[80vw] rounded-full bg-secondary-light opacity-30 blur-[100px]"></div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 flex flex-col items-center justify-center max-w-[400px] w-full text-center gap-lg">
<!-- Animated Loading Indicator -->
<div class="relative w-32 h-32 flex items-center justify-center mb-md">
<!-- Pulsing Rings -->
<div class="absolute w-full h-full rounded-full border-[3px] border-primary-container pulse-ring"></div>
<div class="absolute w-full h-full rounded-full border-[2px] border-primary-container pulse-ring" style="animation-delay: 0.5s;"></div>
<!-- Rotating Dashed Ring -->
<svg class="absolute w-[80%] h-[80%] spin-slow text-primary opacity-60" viewBox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-dasharray="10 10" stroke-width="4"></circle>
</svg>
<!-- Central Icon -->
<div class="w-[60%] h-[60%] bg-surface rounded-full flex items-center justify-center shadow-[0_4px_14px_0_rgba(255,143,171,0.12)] border border-border-subtle z-10">
<span class="material-symbols-outlined text-primary text-[32px] font-bold" data-icon="hub">hub</span>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col gap-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">กำลังจัดหมวดข้อมูล...</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                วิเคราะห์ประเภทและระดับความรุนแรง
            </p>
</div>
<!-- Progress Bar -->
<div class="w-[80%] h-2 bg-surface-container-highest rounded-full overflow-hidden mt-sm shadow-inner">
<div class="h-full bg-primary rounded-full relative w-1/2" style="animation: progress 2s ease-in-out infinite alternate;">
<div class="absolute inset-0 bg-white/20" style="background-image: linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent); background-size: 1rem 1rem; animation: progress-stripes 1s linear infinite;"></div>
</div>
</div>
</div>
<style>
        @keyframes progress {
            0% { width: 10%; }
            100% { width: 90%; }
        }
        @keyframes progress-stripes {
            from { background-position: 1rem 0; }
            to { background-position: 0 0; }
        }
    </style>


</body></html>
