<body class="bg-bg-primary text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md">
<!-- Background Decorators -->
<div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-primary-container rounded-full blur-[80px] opacity-20"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-80 h-80 bg-secondary-light rounded-full blur-[100px] opacity-30"></div>
<main class="w-full max-w-md px-margin-mobile flex flex-col z-10 relative">
<!-- Header -->
<header class="text-center mb-xl"><div class="font-headline-sm text-primary mb-xs">CatchME</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-xs">เลือกหน่วยงานที่กำลังใช้งาน</h1>
<p class="font-body-md text-body-md text-on-surface-variant">กรุณาเลือกแผนกเพื่อเริ่มต้นการทำงานของคุณ</p>
</header>
<!-- Mode Selection Cards -->
<div class="flex flex-col gap-lg w-full">
<!-- OPD Card -->
<button class="glass-card rounded-[24px] border border-border-subtle p-lg flex flex-col items-center justify-center gap-md pink-shadow pink-shadow-hover transition-all duration-300 transform hover:-translate-y-1 group relative overflow-hidden text-left w-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="absolute inset-0 bg-gradient-to-br from-bg-surface-subtle to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<div class="w-16 h-16 rounded-full bg-secondary-light flex items-center justify-center text-on-secondary-fixed mb-xs relative z-10">
<span class="material-symbols-outlined text-[32px]">group</span>
</div>
<div class="text-center relative z-10">
<h2 class="font-headline-md text-headline-md text-on-background mb-base">OPD</h2>
<p class="font-body-md text-body-md text-on-surface-variant">ห้องจ่ายยาผู้ป่วยนอก</p>
</div>
<div class="w-full flex justify-end relative z-10 mt-sm">
<span class="material-symbols-outlined text-primary opacity-0 group-hover:opacity-100 transition-opacity duration-300 transform translate-x-[-10px] group-hover:translate-x-0">arrow_forward</span>
</div>
</button>
<!-- IPD Card -->
<button class="glass-card rounded-[24px] border border-border-subtle p-lg flex flex-col items-center justify-center gap-md pink-shadow pink-shadow-hover transition-all duration-300 transform hover:-translate-y-1 group relative overflow-hidden text-left w-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container mb-xs relative z-10">
<span class="material-symbols-outlined text-[32px]">local_hospital</span>
</div>
<div class="text-center relative z-10">
<h2 class="font-headline-md text-headline-md text-on-background mb-base">IPD</h2>
<p class="font-body-md text-body-md text-on-surface-variant">ห้องจ่ายยาผู้ป่วยใน</p>
</div>
<div class="w-full flex justify-end relative z-10 mt-sm">
<span class="material-symbols-outlined text-primary opacity-0 group-hover:opacity-100 transition-opacity duration-300 transform translate-x-[-10px] group-hover:translate-x-0">arrow_forward</span>

<script>
        // Simple interaction to visually indicate selection before navigation (if applicable)
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                // Remove active state from all
                document.querySelectorAll('button').forEach(btn => {
                    btn.classList.remove('ring-2', 'ring-primary', 'bg-bg-surface-subtle');
                });
                // Add active state to clicked
                this.classList.add('ring-2', 'ring-primary', 'bg-bg-surface-subtle');
                
                // Simulate loading/navigation
                setTimeout(() => {
                    console.log('Navigating to', this.querySelector('h2').innerText);
                }, 300);
            });
        });
    </script>
