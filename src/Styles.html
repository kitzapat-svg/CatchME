<style>
  :root {
    /* Brand Tokens (Sweet Cotton Candy & Berry) */
    --color-primary: #FF8FAB;
    --color-primary-dark: #9B3356;
    --color-primary-deep: #8B2B49;
    --color-primary-container: #FFE5EC;
    --color-surface: #FFFFFF;
    --color-background: #FFF8F9;
    --color-surface-subtle: #FFF0F3;
    
    /* Functional Mode Tokens */
    --color-opd-bg: #EAF4FF;
    --color-opd-border: #A2D2FF;
    --color-opd-text: #1E4F8A;
    --color-opd-badge: #BDE0FE;

    --color-ipd-bg: #FFF0F4;
    --color-ipd-border: #FFB3C6;
    --color-ipd-text: #C94B6E;
    --color-ipd-badge: #FFE5EC;

    /* Typography & Contrast */
    --color-text-primary: #1E293B;
    --color-text-secondary: #64748B;
    --color-text-muted: #94A3B8;

    /* Status Tokens */
    --color-catb-badge: #FFE5EC;
    --color-catb-text: #9B3356;
    --color-alert-bg: #FEE2E2;
    --color-alert-border: #FCA5A5;
    --color-alert-text: #B91C1C;
    --color-success-bg: #D8F3DC;
    --color-success-text: #2D6A4F;

    /* Elevation & Shapes */
    --radius-card: 24px;
    --radius-pill: 9999px;
    --radius-button: 16px;
    --shadow-card: 0 8px 24px -4px rgba(255, 143, 171, 0.15);
    --shadow-mic: 0 10px 28px -2px rgba(255, 143, 171, 0.45);
    --shadow-float: 0 12px 32px rgba(30, 41, 59, 0.08);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Plus Jakarta Sans', 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--color-background);
    color: var(--color-text-primary);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Centered Mobile Container (360px - 440px) */
  .app-container {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    background-color: var(--color-background);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.03);
  }

  /* Header */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 248, 249, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 224, 230, 0.8);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--color-primary-dark);
    letter-spacing: -0.5px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Mode Badge Pill */
  .mode-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: 1px solid transparent;
  }

  .mode-badge:active {
    transform: scale(0.96);
  }

  .mode-badge.opd {
    background-color: var(--color-opd-bg);
    color: var(--color-opd-text);
    border-color: var(--color-opd-border);
  }

  .mode-badge.ipd {
    background-color: var(--color-ipd-bg);
    color: var(--color-ipd-text);
    border-color: var(--color-ipd-border);
  }

  .alias-badge {
    padding: 5px 10px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 600;
    background-color: var(--color-surface-subtle);
    color: var(--color-text-secondary);
  }

  /* Screen Content */
  .screen-content {
    flex: 1;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
  }

  /* Card Component */
  .catchme-card {
    background: var(--color-surface);
    border-radius: var(--radius-card);
    padding: 22px;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(255, 224, 230, 0.7);
    margin-bottom: 18px;
  }

  /* Typography Utilities */
  .title-lg {
    font-size: 22px;
    font-weight: 800;
    color: var(--color-text-primary);
    line-height: 1.3;
  }

  .subtitle {
    font-size: 14px;
    color: var(--color-text-secondary);
    margin-top: 4px;
  }

  /* First-Use Mode Selection Cards */
  .mode-select-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 20px 0;
  }

  .mode-select-card {
    background: var(--color-surface);
    border: 2px solid #E2E8F0;
    border-radius: 20px;
    padding: 20px 14px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .mode-select-card.selected.opd {
    border-color: #3B82F6;
    background: var(--color-opd-bg);
    box-shadow: 0 4px 16px rgba(59, 130, 246, 0.15);
  }

  .mode-select-card.selected.ipd {
    border-color: #EC4899;
    background: var(--color-ipd-bg);
    box-shadow: 0 4px 16px rgba(236, 72, 153, 0.15);
  }

  .mode-card-title {
    font-size: 18px;
    font-weight: 700;
    margin-top: 8px;
  }

  .mode-card-desc {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-top: 4px;
  }

  /* Inputs */
  .input-group {
    margin-bottom: 18px;
  }

  .input-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-secondary);
    margin-bottom: 6px;
  }

  .input-field {
    width: 100%;
    padding: 12px 16px;
    border-radius: 14px;
    border: 1px solid #CBD5E1;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    background: var(--color-surface);
  }

  .input-field:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(255, 143, 171, 0.2);
  }

  /* Buttons */
  .btn-primary {
    width: 100%;
    padding: 15px 20px;
    border-radius: var(--radius-pill);
    background: var(--color-primary-dark);
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(155, 51, 86, 0.25);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .btn-primary:active {
    transform: scale(0.98);
    background: var(--color-primary-deep);
  }

  .btn-secondary {
    width: 100%;
    padding: 13px 20px;
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    color: var(--color-text-primary);
    font-size: 15px;
    font-weight: 600;
    border: 1px solid #CBD5E1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
  }

  /* Microphone Circle */
  .mic-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 0 24px;
  }

  .mic-button {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FF8FAB 0%, #FB6F92 100%);
    border: none;
    box-shadow: var(--shadow-mic);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mic-button:active {
    transform: scale(0.93);
  }

  .mic-icon {
    font-size: 46px;
    color: #FFFFFF;
  }

  .mic-prompt {
    font-size: 17px;
    font-weight: 700;
    color: var(--color-text-primary);
    margin-top: 18px;
    text-align: center;
  }

  .mic-subtext {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-top: 4px;
    text-align: center;
  }

  /* Tagline Footer */
  .tagline-footer {
    text-align: center;
    padding: 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--color-primary-dark);
    letter-spacing: 0.2px;
  }

  /* Recording & Pulse Animations */
  .mic-button.recording {
    background: linear-gradient(135deg, #FF4D6D 0%, #C9184A 100%);
    box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7);
    animation: micPulse 1.5s infinite;
  }

  @keyframes micPulse {
    0% {
      transform: scale(1);
      box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7);
    }
    70% {
      transform: scale(1.06);
      box-shadow: 0 0 0 22px rgba(255, 77, 109, 0);
    }
    100% {
      transform: scale(1);
      box-shadow: 0 0 0 0 rgba(255, 77, 109, 0);
    }
  }

  .wave-bars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 36px;
    margin: 16px 0;
  }

  .wave-bar {
    width: 4px;
    height: 10px;
    background-color: var(--color-primary-dark);
    border-radius: 999px;
    animation: waveBounce 1.2s ease-in-out infinite alternate;
  }

  .wave-bar:nth-child(2) { animation-delay: 0.15s; }
  .wave-bar:nth-child(3) { animation-delay: 0.3s; }
  .wave-bar:nth-child(4) { animation-delay: 0.45s; }
  .wave-bar:nth-child(5) { animation-delay: 0.6s; }

  @keyframes waveBounce {
    0% { height: 8px; opacity: 0.4; }
    100% { height: 32px; opacity: 1; }
  }

  .transcript-preview-box {
    background: #FFFFFF;
    border: 1px solid rgba(255, 143, 171, 0.3);
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--color-text-primary);
    min-height: 52px;
    margin-top: 14px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(255, 143, 171, 0.08);
  }

  /* Glass Cards */
  .glass-card {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 224, 230, 0.9);
    border-radius: var(--radius-card);
    padding: 20px;
    box-shadow: var(--shadow-card);
  }

  /* Status Chips */
  .badge-catb {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background-color: var(--color-catb-badge);
    color: var(--color-catb-text);
    border: 1px solid var(--color-primary);
    padding: 5px 12px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .risk-code-display {
    font-size: 26px;
    font-weight: 800;
    color: var(--color-primary-dark);
    letter-spacing: -0.5px;
    line-height: 1;
  }

  /* Error Comparison Detail Box */
  .error-detail-box {
    background-color: var(--color-surface-subtle);
    border: 1px solid #FFE0E6;
    border-radius: 14px;
    padding: 12px 14px;
    margin-top: 8px;
  }

  .comparison-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed rgba(255, 143, 171, 0.3);
  }

  .val-actual {
    color: #B91C1C;
    font-weight: 600;
  }

  .val-expected {
    color: #056D34;
    font-weight: 600;
  }

  /* Accordion Raw Transcript */
  .transcript-details {
    margin-top: 14px;
    border-top: 1px solid rgba(255, 224, 230, 0.6);
    padding-top: 10px;
  }

  .transcript-summary {
    font-size: 13px;
    font-weight: 600;
    color: #30628A;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
  }

  .transcript-text {
    margin-top: 8px;
    padding: 10px 12px;
    background: #F8FAFC;
    border-radius: 10px;
    font-size: 13px;
    color: var(--color-text-secondary);
    font-style: italic;
    border: 1px solid #E2E8F0;
    word-break: break-word;
  }

  /* Bento Option Cards (Clarification) */
  .bento-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 18px;
  }

  .bento-card-btn {
    background: #FFFFFF;
    border: 1.5px solid #FFE0E6;
    border-radius: 18px;
    padding: 18px;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255, 143, 171, 0.08);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .bento-card-btn:active {
    transform: scale(0.98);
    background-color: #FFF5F7;
    border-color: var(--color-primary);
  }

  .bento-card-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--color-text-primary);
  }

  .bento-card-sub {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-top: 2px;
  }

  /* Cat B Hard Stop Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(18, 28, 44, 0.45);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .hard-stop-card {
    background: #FFFFFF;
    border-radius: 24px;
    padding: 28px 24px;
    text-align: center;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
    animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .warning-icon-badge {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background-color: #FEE2E2;
    color: #B91C1C;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    margin-bottom: 16px;
  }

  /* Success State */
  .success-circle {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    background: linear-gradient(135deg, #72EFDD 0%, #48CAE4 100%);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    margin: 0 auto 20px;
    box-shadow: 0 10px 24px rgba(114, 239, 221, 0.4);
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Material Symbols Font Loading */
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    font-size: 24px;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-smoothing: antialiased;
  }

  /* Utility display */
  .hidden {
    display: none !important;
  }

  /* Quick Presets Section */
  .quick-presets-container {
    margin-top: 16px;
    text-align: left;
  }

  .preset-section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding: 0 2px;
  }

  .preset-section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--color-primary-dark);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .preset-card-btn {
    font-family: inherit;
    background: #FFFFFF;
    border: 1.5px solid #FFE5EC;
    border-radius: 16px;
    padding: 12px;
    text-align: left;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 6px;
    box-shadow: 0 2px 8px rgba(255, 143, 171, 0.08);
    outline: none;
  }

  .preset-card-btn:hover {
    border-color: var(--color-primary);
    background: #FFFDFC;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(255, 143, 171, 0.2);
  }

  .preset-card-btn:active {
    transform: scale(0.97);
  }

  .preset-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .preset-icon {
    font-size: 20px;
    line-height: 1;
  }

  .preset-badge {
    font-size: 11px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 6px;
    background: var(--color-primary-container);
    color: var(--color-primary-dark);
    letter-spacing: 0.5px;
  }

  .preset-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--color-text-primary);
    line-height: 1.3;
  }

  .preset-desc {
    font-size: 11px;
    color: var(--color-text-secondary);
    line-height: 1.25;
  }

  /* Drug & Quantity Chip Pills */
  .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }

  .chip-pill {
    padding: 5px 12px;
    background: #FFF0F3;
    border: 1px solid #FFE5EC;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--color-primary-dark);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    font-family: inherit;
  }

  .chip-pill:hover {
    background: #FFE5EC;
    border-color: var(--color-primary);
  }

  .chip-pill:active {
    transform: scale(0.95);
  }

  .chip-pill.active {
    background: var(--color-primary-dark);
    color: #FFFFFF;
    border-color: var(--color-primary-dark);
  }

  /* Code Dictionary Tabs & List */
  .dict-tab-bar {
    display: flex;
    background: #FFF0F3;
    padding: 4px;
    border-radius: 12px;
    border: 1px solid #FFE5EC;
    gap: 4px;
    margin-bottom: 14px;
  }

  .dict-tab-btn {
    flex: 1;
    font-family: inherit;
    border: none;
    background: transparent;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
    outline: none;
  }

  .dict-tab-btn.active {
    background: #FFFFFF;
    color: var(--color-primary-dark);
    box-shadow: 0 2px 8px rgba(155, 51, 86, 0.12);
  }

  .dict-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 52vh;
    overflow-y: auto;
    padding-right: 4px;
  }

  .dict-item {
    background: #FFFFFF;
    border: 1px solid #FFE5EC;
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: all 0.15s ease;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
  }

  .dict-item.highlight {
    background: #FFF5F7;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 2px rgba(255, 143, 171, 0.4);
  }

  .dict-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dict-code {
    display: inline-block;
    font-family: monospace;
    font-weight: 800;
    font-size: 13px;
    padding: 2px 8px;
    border-radius: 6px;
    background: #F1F5F9;
    color: #1E293B;
  }

  .dict-code.stage {
    background: #E0F2FE;
    color: #0369A1;
  }

  .dict-code.risk-b {
    background: #FFE4E6;
    color: #9F1239;
  }

  .dict-code.risk-a {
    background: #FEF3C7;
    color: #92400E;
  }

  .dict-code.risk-e {
    background: #EDE9FE;
    color: #5B21B6;
  }

  .dict-item-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--color-text-primary);
  }

  .dict-item-desc {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.35;
  }

  .dict-item-en {
    font-size: 11px;
    color: var(--color-text-muted);
    font-style: italic;
  }

  /* Customize Presets Card in Modal */
  .custom-preset-row {
    background: #FFFFFF;
    border: 1.5px solid #FFE5EC;
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    transition: all 0.15s ease;
  }

  .custom-preset-row.disabled {
    opacity: 0.5;
    background: #F8FAFC;
    border-color: #E2E8F0;
  }

  .custom-preset-info {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    overflow: hidden;
  }

  .custom-preset-toggle {
    cursor: pointer;
