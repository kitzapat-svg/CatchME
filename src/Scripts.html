  /**
   * Factory to create a fresh SpeechRecognition instance for clean lifecycle.
   */
  function createSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return null;

    try {
      const recognition = new SpeechRecognition();
      recognition.lang = 'th-TH';
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      recognition.continuous = false;

      recognition.onstart = function() {
        state.isRecording = true;
        state.capturedTranscript = '';
        showScreen('screen-recording');
        const preview = document.getElementById('live-transcript-preview');
        if (preview) {
          preview.innerHTML = '<span style="color: var(--color-primary-dark); font-weight: 600;">กำลังฟัง... (พูดได้เลย)</span>';
        }
      };

      recognition.onresult = function(event) {
        let interim = '';
        let final = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }

        const currentText = final || interim;
        if (currentText) {
          state.capturedTranscript = currentText;
          const preview = document.getElementById('live-transcript-preview');
          if (preview) {
            preview.innerText = '"' + currentText + '"';
          }
        }
      };

      recognition.onerror = function(event) {
        console.warn('Speech recognition error:', event.error);
        state.isRecording = false;
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          alert('ไมโครโฟนยังไม่ได้รับอนุญาต:\n1. คลิกไอคอนแม่กุญแจ 🔒 (หรือการตั้งค่าสิทธิ์) ข้างแถบ URL ด้านบน\n2. ไปที่ "สิทธิ์" (Permissions) > เลือก "อนุญาตไมโครโฟน" (Allow Microphone)\nหรือคลิกปุ่ม "พิมพ์ข้อความแทน" ได้ทันทีครับ');
          openTextFallback();
        } else if (event.error === 'audio-capture') {
          alert('ไม่พบอุปกรณ์ไมโครโฟนในเครื่องนี้ (No Microphone Found):\nกรุณาเสียบหูฟัง Smalltalk, ไมค์ USB หรือตรวจสอบการตั้งค่า Microphone ใน Windows\n\nระบบจะเปิดกล่องพิมพ์ข้อความแทนให้ครับ');
          openTextFallback();
        } else if (event.error === 'no-speech') {
          showScreen('screen-quick-report');
        } else {
          showScreen('screen-quick-report');
        }
      };

      recognition.onend = function() {
        state.isRecording = false;
        if (state.capturedTranscript && state.capturedTranscript.trim()) {
          showScreen('screen-processing');
          setTimeout(function() {
            processTranscript(state.capturedTranscript.trim());
          }, 300);
        } else {
          showScreen('screen-quick-report');
        }
      };

      return recognition;
    } catch (e) {
      console.warn('Failed to construct SpeechRecognition:', e);
      return null;
    }
  }

  /**
   * Safe ArrayBuffer to Base64 conversion without call-stack overflow.
   */
  function arrayBufferToBase64(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      const chunk = bytes.subarray(i, i + chunkSize);
      binary += String.fromCharCode.apply(null, chunk);
    }
    return btoa(binary);
  }

  /**
   * Resamples any audio blob into standard 16kHz mono WAV for optimal Gemini AI ingestion.
   */
  async function blobToWavBase64(blob) {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        const arrayBuffer = await blob.arrayBuffer();
        const audioCtx = new AudioContextClass();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const targetSampleRate = 16000;
        const numChannels = 1;
        const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(
          numChannels,
          Math.ceil(audioBuffer.duration * targetSampleRate),
          targetSampleRate
        );
        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(offlineCtx.destination);
        source.start(0);
        const renderedBuffer = await offlineCtx.startRendering();

        const pcmData = renderedBuffer.getChannelData(0);
        const wavBuffer = new ArrayBuffer(44 + pcmData.length * 2);
        const view = new DataView(wavBuffer);

        function writeString(view, offset, string) {
          for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
          }
        }

        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + pcmData.length * 2, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); // PCM
        view.setUint16(22, 1, true); // Mono
        view.setUint32(24, targetSampleRate, true);
        view.setUint32(28, targetSampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, 'data');
        view.setUint32(40, pcmData.length * 2, true);

        let offset = 44;
        for (let i = 0; i < pcmData.length; i++, offset += 2) {
          let s = Math.max(-1, Math.min(1, pcmData[i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }

        return {
          base64: arrayBufferToBase64(wavBuffer),
          mimeType: 'audio/wav'
        };
      }
    } catch (err) {
      console.warn('WAV conversion fallback triggered:', err);
    }

    // Direct fallback
    const rawBase64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    return {
      base64: rawBase64,
      mimeType: blob.type || 'audio/webm'
    };
  }

  /**
   * Sends audio to Google Gemini Flash API for multimodal transcription and Cat B analysis.
   */
  async function sendAudioToGemini(base64Audio, mimeType) {
    const apiKey = GEMINI_CONFIG.getApiKey();
    if (!apiKey) throw new Error('ไม่พบ Google Gemini API Key');

    const response = await fetch(GEMINI_CONFIG.endpoint(apiKey), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        contents: [{
          parts: [
            {
              inlineData: {
                mimeType: mimeType || 'audio/wav',
                data: base64Audio
              }
            },
            {
              text: GEMINI_CLINICAL_PROMPT
            }
          ]
        }],
        generationConfig: {
          responseMimeType: 'application/json',
          temperature: 0.1
        }
      })
    });

    if (!response.ok) {
      const errJson = await response.json().catch(function() { return {}; });
      const errMsg = (errJson.error && errJson.error.message) || ('HTTP ' + response.status);
      throw new Error(errMsg);
    }

    const data = await response.json();
    let resText = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0].text;
    if (!resText) throw new Error('Gemini ไม่ส่งคำตอบกลับมา');
    resText = resText.replace(/```json/gi, '').replace(/```/g, '').trim();
    return JSON.parse(resText);
  }

  /**
   * Converts structured Gemini response into standard CatchME parsed object.
   */
  function convertGeminiToParsed(geminiData, fallbackText) {
    const transcript = geminiData.transcript || fallbackText || '';
    const isCatB = geminiData.catBEligible !== false && geminiData.patientReached !== 'Yes';
    const stageCode = geminiData.detectedStage || 'DS02';
    const parsedObj = {
      rawTranscript: transcript,
      normalizedTranscript: transcript,
      catBEligible: isCatB,
      patientReached: geminiData.patientReached || (isCatB ? 'No' : 'Yes'),
      safetyStopReason: geminiData.safetyStopReason || (!isCatB ? 'ยาอาจถึงตัวผู้ป่วยแล้ว ไม่เข้าข่าย Category B (Near Miss)' : ''),
      legacyCode: geminiData.legacyCode || 'B29',
      errorType: geminiData.errorType || 'Medication Error',
      process: geminiData.process || 'Pre-dispensing',
      processStage: geminiData.process === 'Prescribing' ? 'PS01' : (geminiData.process === 'Transcribing' ? 'PS07' : 'PS04'),
      detectedStage: stageCode,
      detectedStageName: stageName,
      confidence: 'High',
      mode: state.mode || 'OPD',
      extractedEntities: {
        drugs: (geminiData.drug && geminiData.drug !== '-' && geminiData.drug !== 'ไม่ระบุ') ? [geminiData.drug] : [],
        actual: geminiData.actual && geminiData.actual !== '-' ? geminiData.actual : '',
        expected: geminiData.expected && geminiData.expected !== '-' ? geminiData.expected : ''
      }
    };

    if (typeof detectLasaInfo === 'function') {
      const lasa = detectLasaInfo(transcript, parsedObj.extractedEntities, parsedObj);
      parsedObj.isLasa = lasa.isLasa;
      parsedObj.lasaType = lasa.lasaType;
      parsedObj.lasaPrescribed = lasa.lasaPrescribed;
      parsedObj.lasaDispensed = lasa.lasaDispensed;
      parsedObj.lasaPairKey = lasa.lasaPairKey;
      parsedObj.lasaMatchedMaster = lasa.matchedMaster;
      parsedObj.tradeName = '';
      if (lasa.isLasa && (!parsedObj.extractedEntities.actual || !parsedObj.extractedEntities.expected)) {
        if (lasa.lasaDispensed) parsedObj.extractedEntities.actual = lasa.lasaDispensed;
        if (lasa.lasaPrescribed) parsedObj.extractedEntities.expected = lasa.lasaPrescribed;
      }
    }

    return parsedObj;
  }

  /**
   * Starts high-fidelity audio recording for Google Gemini Flash AI.
   */
  async function startSpeechCapture() {
    let apiKey = GEMINI_CONFIG.getApiKey();
    if (!apiKey) {
      const inputKey = prompt('🔑 เพื่อเปิดใช้งาน Google Gemini Flash AI\nกรุณาวาง Gemini API Key ของคุณที่นี่ (ตั้งค่าครั้งเดียว):', '');
      if (!inputKey || !inputKey.trim()) {
        openTextFallback();
        return;
      }
      GEMINI_CONFIG.setApiKey(inputKey.trim());
      apiKey = inputKey.trim();
    }

    const isInIframe = window.self !== window.top;
    if (isInIframe) {
      alert('ไมโครโฟนถูกจำกัดใน iframe ของ Google Apps Script\n\nกรุณาเปิดผ่านลิงก์ GitHub Pages เพื่อใช้งาน Gemini Flash ได้เต็มรูปแบบครับ:\nhttps://kitzapat-svg.github.io/CatchME/');
      openTextFallback();
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('เบราว์เซอร์นี้ไม่รองรับการเข้าถึงไมโครโฟน (MediaDevices)\nกำลังเปิดกล่องพิมพ์ข้อความแทนให้ครับ');
      openTextFallback();
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.audioStream = stream;

      let mimeType = '';
      if (typeof MediaRecorder !== 'undefined') {
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mimeType = 'audio/webm;codecs=opus';
        else if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
        else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
      }

      state.mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      state.audioChunks = [];
      state.isRecording = true;

      state.mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) {
          state.audioChunks.push(e.data);
        }
      };

      state.mediaRecorder.onstart = function() {
        showScreen('screen-recording');
        const preview = document.getElementById('live-transcript-preview');
        if (preview) {
          preview.innerHTML = '<span style="color: var(--color-primary-dark); font-weight: 600;">กำลังบันทึกเสียง... เมื่อพูดจบแตะปุ่ม "เสร็จสิ้น"</span>';
        }
      };

      state.mediaRecorder.onstop = async function() {
        state.isRecording = false;
        if (state.audioStream) {
          state.audioStream.getTracks().forEach(function(track) { track.stop(); });
          state.audioStream = null;
        }

        if (!state.audioChunks || state.audioChunks.length === 0) {
          showScreen('screen-quick-report');
          return;
        }

        const blobType = (state.mediaRecorder && state.mediaRecorder.mimeType) || 'audio/webm';
        const audioBlob = new Blob(state.audioChunks, { type: blobType });

        showScreen('screen-processing');
        const procTitle = document.getElementById('processing-title');
        const procSub = document.getElementById('processing-subtext');
        if (procTitle) procTitle.innerText = '⚡ Google Gemini Flash กำลังประมวลผล...';
        if (procSub) procSub.innerText = 'ฟังเสียง ถอดความชื่อยาภาษาอังกฤษ และวิเคราะห์รหัสความเสี่ยง';

        try {
          const { base64, mimeType } = await blobToWavBase64(audioBlob);
          const geminiData = await sendAudioToGemini(base64, mimeType);
          if (geminiData && (geminiData.transcript || geminiData.legacyCode)) {
            state.capturedTranscript = geminiData.transcript || '';
            const parsed = convertGeminiToParsed(geminiData, state.capturedTranscript);
            handleParsedResult(parsed);
          } else {
            alert('ไม่สามารถประมวลผลเสียงได้ กรุณาลองใหม่อีกครั้งครับ');
            showScreen('screen-quick-report');
          }
        } catch (err) {
          console.error('Gemini Audio error:', err);
          alert('Gemini AI Error: ' + err.message + '\n\nระบบจะเปิดกล่องพิมพ์ข้อความแทนให้ครับ');
          openTextFallback();
        }
      };

      state.mediaRecorder.start(200);

    } catch (err) {
      console.warn('Microphone capture error:', err);
      state.isRecording = false;
      if (state.audioStream) {
        state.audioStream.getTracks().forEach(function(track) { track.stop(); });
        state.audioStream = null;
      }

      if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
        alert('ไม่พบอุปกรณ์ไมโครโฟนในเครื่องนี้:\nกรุณาเสียบหูฟัง Smalltalk, ไมค์ USB หรือตรวจสอบการตั้งค่า Microphone ใน Windows');
      } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        alert('ไมโครโฟนยังไม่ได้รับอนุญาต:\n1. คลิกไอคอนแม่กุญแจ 🔒 ที่แถบ URL ด้านบน\n2. ไปที่ "สิทธิ์" (Permissions) > เลือก "อนุญาตไมโครโฟน" (Allow Microphone)');
      } else {
        alert('ไม่สามารถเปิดไมโครโฟนได้ (' + err.name + ': ' + err.message + ')');
      }
      openTextFallback();
    }
  }

  /**
   * Stops recording manually and triggers Google Gemini Flash transcription.
   */
  function stopSpeechCapture() {
    if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
      try {
        state.mediaRecorder.stop();
      } catch (e) {

  /**
   * Cancels recording and returns to home.
   */
  function cancelSpeechCapture() {
    state.capturedTranscript = '';
    state.isRecording = false;
    if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
      try {
        state.mediaRecorder.onstop = null;
        state.mediaRecorder.stop();
      } catch (e) {}
    }
    if (state.audioStream) {
      try {
        state.audioStream.getTracks().forEach(function(t) { t.stop(); });
      } catch (e) {}
      state.audioStream = null;
    }
    state.audioChunks = [];
    showScreen('screen-quick-report');

  /**
   * Processes the transcript using Google Gemini Flash (with Regex Parser fallback).
   */
  async function processTranscript(text) {
    if (!text || !text.trim()) {
      showScreen('screen-quick-report');
      return;
    }

    showScreen('screen-processing');
    const procTitle = document.getElementById('processing-title');
    const procSub = document.getElementById('processing-subtext');
    if (procTitle) procTitle.innerText = '⚡ Google Gemini Flash กำลังวิเคราะห์...';
    if (procSub) procSub.innerText = 'วิเคราะห์ชื่อยาภาษาอังกฤษและจำแนกรหัสความเสี่ยงอย่างแม่นยำ';

    // 1. Primary: Google Gemini Flash AI (Clinical Understanding)
    try {
      const geminiData = await sendTextToGemini(text.trim());
      if (geminiData && (geminiData.legacyCode || geminiData.drug)) {
        state.capturedTranscript = geminiData.transcript || text.trim();
        const parsed = convertGeminiToParsed(geminiData, text.trim());
        handleParsedResult(parsed);
        return;
      }
    } catch (err) {
      console.warn('Gemini text analysis error, falling back to local regex parser:', err);
    }

    // 2. Secondary Fallback: Client-side Regex Parser (Offline capable)
    if (typeof parseMedicationError === 'function') {
      try {
        const parsed = parseMedicationError(text, state.mode);
        handleParsedResult(parsed);
        return;
      } catch (e) {
        console.warn('Client parser error, attempting server fallback:', e);
      }
    }

    // 3. Tertiary Fallback: Server-side via google.script.run
    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(parsed) {
          handleParsedResult(parsed);
        })
        .withFailureHandler(function(err) {
          alert('เกิดข้อผิดพลาดในการวิเคราะห์: ' + (err.message || err));
          showScreen('screen-quick-report');
        })
        .apiParseMedicationError(text, state.mode);
    } else {
      alert('ไม่พบระบบวิเคราะห์ กรุณาลองใหม่อีกครั้ง');
      showScreen('screen-quick-report');
    }
  }

  /**
   * Routes the parsed result to the appropriate screen.
   */
  function handleParsedResult(parsed) {
    state.currentParsed = parsed;

    // 1. Safety Gate Check (Hard Stop)
    if (!parsed.catBEligible || parsed.patientReached === 'Yes') {
      const reasonEl = document.getElementById('hardstop-reason');
      if (reasonEl) {
        reasonEl.innerText = parsed.safetyStopReason || 'พบสัญญาณว่ายาอาจถึงตัวผู้ป่วยแล้ว';
      }
      openModal('modal-catb-hardstop');
      showScreen('screen-quick-report');
      return;
    }

    // 2. Clarification Check
    if (parsed.requiresClarification && parsed.clarification) {
      renderClarificationScreen(parsed);
      showScreen('screen-clarification');
      return;
    }

    // 3. Normal Confirmation Screen
    renderConfirmationScreen(parsed);
    showScreen('screen-confirmation');
  }

  /**
   * Renders the Confirmation Card UI.
   */
  function renderConfirmationScreen(parsed) {
    document.getElementById('confirm-risk-code').innerText = parsed.legacyCode || 'Cat B';
    
    // Risk Code Description Badge
    const riskMeta = RISK_CODES_DICT[parsed.legacyCode];
    const riskSubEl = document.getElementById('confirm-risk-code-desc');
    if (riskSubEl) {
      riskSubEl.innerText = riskMeta ? (riskMeta.process + ' • ' + riskMeta.nameTh) : '';
    }

    document.getElementById('confirm-error-type').innerText = parsed.errorType || 'Medication Error';
    
    // Medications
    let drugs = '-';
    if (parsed.extractedEntities && parsed.extractedEntities.drugs && parsed.extractedEntities.drugs.length > 0) {
      drugs = parsed.extractedEntities.drugs.join(', ');
    }
    document.getElementById('confirm-drug-name').innerText = drugs;

    // Process & Stage
    document.getElementById('confirm-process-stage').innerText = (parsed.process || '') + (parsed.processStage ? ' (' + parsed.processStage + ')' : '');

    // Detail: Actual vs Expected
    const detailLabel = document.getElementById('confirm-detail-label');
    const actualSpan = document.getElementById('confirm-actual');
    const expectedSpan = document.getElementById('confirm-expected');
    const detailSection = document.getElementById('confirm-detail-section');

    const actualVal = parsed.extractedEntities ? parsed.extractedEntities.actual : '';
    const expectedVal = parsed.extractedEntities ? parsed.extractedEntities.expected : '';

    if (actualVal || expectedVal) {
      detailSection.classList.remove('hidden');
      detailLabel.innerText = parsed.errorType || 'รายละเอียด';
      actualSpan.innerText = 'จัดจริง/สั่งจริง: ' + (actualVal || '-');
      expectedSpan.innerText = 'ควรเป็น: ' + (expectedVal || '-');
    } else {
      detailLabel.innerText = parsed.errorType || 'รายละเอียด';
      actualSpan.innerText = 'โหมด: ' + parsed.mode;
      expectedSpan.innerText = 'ความมั่นใจ: ' + parsed.confidence;
    }

    // Detected stage & explanation
    const stageMeta = DETECTED_STAGES_DICT[parsed.detectedStage];
    const stageName = stageMeta ? stageMeta.nameTh : (parsed.detectedStageName || 'ตรวจพบก่อนถึงผู้ป่วย');
    document.getElementById('confirm-detected-stage').innerText = (parsed.detectedStage || 'DS01') + ' — ' + stageName;
    const stageDescEl = document.getElementById('confirm-detected-stage-desc');
    if (stageDescEl) {
      stageDescEl.innerText = stageMeta ? stageMeta.desc : '';
    }

    // Raw transcript
    document.getElementById('confirm-raw-transcript').innerText = '"' + (parsed.rawTranscript || '') + '"';

    // Render Smart LASA Card
    renderLasaCard(parsed);

    // Reset save button state
    const saveBtn = document.getElementById('btn-save-report');
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<span>บันทึก (Save)</span><span>✓</span>';
    }
  }

  /**
   * Renders the Smart LASA Card on confirmation screen.
   */
  function renderLasaCard(parsed) {
    const cardEl = document.getElementById('confirm-lasa-card');
    const toggleEl = document.getElementById('confirm-lasa-toggle');
    const masterPillEl = document.getElementById('confirm-lasa-master-pill');
    const pairDisplayEl = document.getElementById('confirm-lasa-pair-display');
    const tradeInput = document.getElementById('confirm-trade-name');

    if (!cardEl) return;

    const isLasaCandidate = parsed.isLasa || (parsed.extractedEntities && parsed.extractedEntities.drugs && parsed.extractedEntities.drugs.length >= 2) || (parsed.legacyCode === 'B26' || parsed.legacyCode === 'B03' || parsed.legacyCode === 'A03' || parsed.legacyCode === 'E08' || parsed.legacyCode === 'B28');

    if (isLasaCandidate) {
      cardEl.classList.remove('hidden');
    } else {
      cardEl.classList.add('hidden');
    }

    const isLasa = !!parsed.isLasa;
    if (toggleEl) toggleEl.checked = isLasa;
    state.currentLasaActive = isLasa;
    state.currentLasaType = parsed.lasaType || (isLasa ? 'Sound-alike' : '');
    state.currentTradeName = parsed.tradeName || '';

    if (tradeInput) {
      tradeInput.value = state.currentTradeName;
    }

    // Master Match Badge
    if (parsed.lasaMatchedMaster) {
      masterPillEl.classList.remove('hidden');
      pairDisplayEl.innerText = parsed.lasaMatchedMaster.tallman1 + ' ⇄ ' + parsed.lasaMatchedMaster.tallman2 + ' (' + (parsed.lasaMatchedMaster.riskLevel || 'Standard') + ')';
    } else if (parsed.lasaPrescribed && parsed.lasaDispensed) {
      masterPillEl.classList.remove('hidden');
      pairDisplayEl.innerText = parsed.lasaPrescribed + ' ⇄ ' + parsed.lasaDispensed;
    } else {
      masterPillEl.classList.add('hidden');
    }

    // Emerging LASA Risk Banner Check
    const emergingBanner = document.getElementById('confirm-emerging-lasa-banner');
    const emergingCountBadge = document.getElementById('confirm-emerging-count-badge');
    const emergingDesc = document.getElementById('confirm-emerging-desc');
    state.currentEmergingPair = null;

    if (!parsed.lasaMatchedMaster && (parsed.lasaPairKey || (parsed.extractedEntities && parsed.extractedEntities.actual && parsed.extractedEntities.expected))) {
      var checkKey = parsed.lasaPairKey;
      if (!checkKey && parsed.extractedEntities && parsed.extractedEntities.actual && parsed.extractedEntities.expected) {
        checkKey = [parsed.extractedEntities.actual.toLowerCase().trim(), parsed.extractedEntities.expected.toLowerCase().trim()].sort().join('_');
      }
      var foundEmerging = (state.emergingPairsCache || []).find(function (e) {
        return e.pairKey === checkKey;
      });
      if (foundEmerging && emergingBanner) {
        emergingBanner.classList.remove('hidden');
        if (emergingCountBadge) emergingCountBadge.innerText = 'เกิดซ้ำ ' + foundEmerging.count + ' ครั้ง';
        if (emergingDesc) emergingDesc.innerText = 'คู่ยานี้ (' + foundEmerging.drug1 + ' ⇄ ' + foundEmerging.drug2 + ') มีสถิติเกิดข้อผิดพลาดซ้ำ แต่ยังไม่ได้ขึ้นทะเบียนใน Master ของ รพ.';
        state.currentEmergingPair = foundEmerging;
      } else if (emergingBanner) {
        emergingBanner.classList.add('hidden');
      }
    } else if (emergingBanner) {
      emergingBanner.classList.add('hidden');
    }

    updateLasaPillUI();
  }

  function toggleLasaActive(isActive) {
    state.currentLasaActive = isActive;
    if (state.currentParsed) {
      state.currentParsed.isLasa = isActive;
      if (isActive && !state.currentLasaType) {
        state.currentLasaType = 'Sound-alike';
        state.currentParsed.lasaType = 'Sound-alike';
      }
    }
    updateLasaPillUI();
  }

  function selectLasaType(type) {
    state.currentLasaType = type;
    if (state.currentParsed) {
      state.currentParsed.isLasa = true;
      state.currentParsed.lasaType = type;
    }
    state.currentLasaActive = true;
    const toggleEl = document.getElementById('confirm-lasa-toggle');
    if (toggleEl) toggleEl.checked = true;
    updateLasaPillUI();
  }

  function updateLasaPillUI() {
    const btnSound = document.getElementById('btn-lasa-sound');
    const btnLook = document.getElementById('btn-lasa-look');
    const btnBoth = document.getElementById('btn-lasa-both');
    const bodyEl = document.getElementById('confirm-lasa-body');

    if (bodyEl) {
      bodyEl.style.opacity = state.currentLasaActive ? '1' : '0.4';
      bodyEl.style.pointerEvents = state.currentLasaActive ? 'auto' : 'none';
    }

    if (btnSound) btnSound.classList.toggle('active', state.currentLasaActive && state.currentLasaType === 'Sound-alike');
    if (btnLook) btnLook.classList.toggle('active', state.currentLasaActive && state.currentLasaType === 'Look-alike');
    if (btnBoth) btnBoth.classList.toggle('active', state.currentLasaActive && state.currentLasaType === 'Both');
  }

  function updateTradeName(val) {
    state.currentTradeName = val;
    if (state.currentParsed) {
      state.currentParsed.tradeName = val;
    }
  }

  function onEditLasaToggle(checked) {
    const editLasaFields = document.getElementById('edit-lasa-fields');
    if (editLasaFields) editLasaFields.classList.toggle('hidden', !checked);
  }

  /**
   * Renders the Clarification Screen with Bento Grid options.
   */
  function renderClarificationScreen(parsed) {
    const titleEl = document.getElementById('clarification-question-title');
    const subEl = document.getElementById('clarification-question-sub');
    const gridEl = document.getElementById('clarification-options-grid');

    const clarify = parsed.clarification;
    titleEl.innerText = clarify.question || 'ต้องการข้อมูลเพิ่มเติม';
    subEl.innerText = 'แตะเลือก 1 คำตอบเพื่อจำแนกรหัสความเสี่ยงที่ถูกต้อง';
    gridEl.innerHTML = '';

    const choices = clarify.choices || [];
    choices.forEach(function(choiceText) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bento-card-btn';
      btn.innerHTML = `
        <div>
          <div class="bento-card-title">${choiceText}</div>
          <div class="bento-card-sub">แตะเพื่อระบุขั้นตอนนี้</div>
        </div>
        <span style="font-size: 20px; color: var(--color-primary);">→</span>
      `;
      btn.onclick = function() {
        resolveClarification(choiceText);
      };
      gridEl.appendChild(btn);
    });
  }

  /**
   * Resolves clarification answer and transitions to Confirmation.
   */
  function resolveClarification(choiceText) {
    if (!state.currentParsed) return;

    // Apply specific code mappings from clarification choices
    if (choiceText.indexOf('A10') !== -1 || choiceText.indexOf('แพทย์สั่ง') !== -1) {
      state.currentParsed.legacyCode = 'A10';
      state.currentParsed.process = 'Prescribing';
      state.currentParsed.processStage = 'PS01';
      state.currentParsed.errorType = 'ผิดจำนวน/ปริมาณ';
      state.currentParsed.detectedStage = 'DS01';
    } else if (choiceText.indexOf('B08') !== -1 || choiceText.indexOf('ห้องยาคีย์') !== -1) {
      state.currentParsed.legacyCode = 'B08';
      state.currentParsed.process = 'Pre-dispensing';
      state.currentParsed.processStage = 'PS02';
      state.currentParsed.errorType = 'ผิดจำนวน/ปริมาณ';
      state.currentParsed.detectedStage = 'DS02';
    } else if (choiceText.indexOf('B29') !== -1 || choiceText.indexOf('คนจัดยา') !== -1) {
      state.currentParsed.legacyCode = 'B29';
      state.currentParsed.process = 'Pre-dispensing';
      state.currentParsed.processStage = 'PS04';
      state.currentParsed.errorType = 'ผิดจำนวน/ปริมาณ';
      state.currentParsed.detectedStage = 'DS04';
    } else if (choiceText.indexOf('B22') !== -1 || choiceText.indexOf('ไม่ได้รับคำสั่ง STAT') !== -1) {
      state.currentParsed.legacyCode = 'B22';
      state.currentParsed.process = 'Pre-dispensing';
      state.currentParsed.processStage = 'PS03';
      state.currentParsed.errorType = 'ตกหล่นคำสั่ง STAT/ด่วน';
      state.currentParsed.detectedStage = 'DS05';
    } else if (choiceText.indexOf('E11') !== -1 || choiceText.indexOf('ไม่ได้ติดป้าย STAT') !== -1) {
      state.currentParsed.legacyCode = 'E11';
      state.currentParsed.process = 'Transcribing';
      state.currentParsed.processStage = 'PS07';
      state.currentParsed.errorType = 'ตกหล่นคำสั่ง STAT/ด่วน';
      state.currentParsed.detectedStage = 'DS05';
    } else if (choiceText.indexOf('B25') !== -1 || choiceText.indexOf('ทั้งชุด') !== -1) {
      state.currentParsed.legacyCode = 'B25';
      state.currentParsed.process = 'Pre-dispensing';
      state.currentParsed.processStage = 'PS04';
      state.currentParsed.errorType = 'ผิดผู้ป่วย';
      state.currentParsed.detectedStage = 'DS04';
    } else if (choiceText.indexOf('B34') !== -1 || choiceText.indexOf('ปนบางรายการ') !== -1) {
      state.currentParsed.legacyCode = 'B34';
      state.currentParsed.process = 'Pre-dispensing';
      state.currentParsed.processStage = 'PS04';
      state.currentParsed.errorType = 'ผิดผู้ป่วย';
      state.currentParsed.detectedStage = 'DS04';
    }

    state.currentParsed.confidence = 'High';
    state.currentParsed.neededClarification = true;
    renderConfirmationScreen(state.currentParsed);
    showScreen('screen-confirmation');
  }

  /**
   * Skips clarification question.
   */
  function skipClarification() {
    if (state.currentParsed) {
      renderConfirmationScreen(state.currentParsed);
      showScreen('screen-confirmation');
    } else {
      showScreen('screen-quick-report');
    }
  }

  /**
   * Opens minimal edit modal.
   */
  function openMinimalEdit() {
    if (!state.currentParsed) return;
    document.getElementById('edit-risk-code').value = state.currentParsed.legacyCode || '';
    
    let drugs = '';
    if (state.currentParsed.extractedEntities && state.currentParsed.extractedEntities.drugs) {
      drugs = state.currentParsed.extractedEntities.drugs.join(', ');
    }
    document.getElementById('edit-drug-name').value = drugs;
    document.getElementById('edit-actual').value = state.currentParsed.extractedEntities ? state.currentParsed.extractedEntities.actual : '';
    document.getElementById('edit-expected').value = state.currentParsed.extractedEntities ? state.currentParsed.extractedEntities.expected : '';

    const isLasaEdit = document.getElementById('edit-is-lasa');
    const lasaTypeEdit = document.getElementById('edit-lasa-type');
    const tradeNameEdit = document.getElementById('edit-trade-name');
    const editLasaFields = document.getElementById('edit-lasa-fields');

    const isLasaVal = !!(state.currentParsed.isLasa || state.currentLasaActive);
    if (isLasaEdit) isLasaEdit.checked = isLasaVal;
    if (editLasaFields) editLasaFields.classList.toggle('hidden', !isLasaVal);
    if (lasaTypeEdit) lasaTypeEdit.value = state.currentParsed.lasaType || state.currentLasaType || 'Sound-alike';
    if (tradeNameEdit) tradeNameEdit.value = state.currentParsed.tradeName || state.currentTradeName || '';

    openModal('modal-minimal-edit');

  /**
   * Applies minimal edit changes.
   */
  function applyMinimalEdit() {
    if (!state.currentParsed) return;
    const newCode = document.getElementById('edit-risk-code').value.trim();
    const newDrug = document.getElementById('edit-drug-name').value.trim();
    const newActual = document.getElementById('edit-actual').value.trim();
    const newExpected = document.getElementById('edit-expected').value.trim();

    const isLasaChecked = document.getElementById('edit-is-lasa') ? document.getElementById('edit-is-lasa').checked : false;
    const editLasaType = document.getElementById('edit-lasa-type') ? document.getElementById('edit-lasa-type').value : '';
    const editTrade = document.getElementById('edit-trade-name') ? document.getElementById('edit-trade-name').value.trim() : '';

    if (newCode) state.currentParsed.legacyCode = newCode;
    if (!state.currentParsed.extractedEntities) state.currentParsed.extractedEntities = {};
    if (newDrug) state.currentParsed.extractedEntities.drugs = [newDrug];
    state.currentParsed.extractedEntities.actual = newActual;
    state.currentParsed.extractedEntities.expected = newExpected;

    state.currentParsed.isLasa = isLasaChecked;
    state.currentParsed.lasaType = isLasaChecked ? editLasaType : '';
    state.currentParsed.tradeName = editTrade;
    state.currentLasaActive = isLasaChecked;
    state.currentLasaType = state.currentParsed.lasaType;
    state.currentTradeName = editTrade;

    closeModal('modal-minimal-edit');
    renderConfirmationScreen(state.currentParsed);
  }

  /**
   * Saves the confirmed report to Google Sheets or local mock.
   */
  function saveReport() {
    if (state.isSaving || !state.currentParsed) return;
    state.isSaving = true;

    const saveBtn = document.getElementById('btn-save-report');
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span>กำลังบันทึก...</span>';
    }

    const payload = {
      deviceSessionId: state.deviceId,
      reporterAlias: state.alias || 'Anon',
      mode: state.mode,
      rawTranscript: state.currentParsed.rawTranscript,
      normalizedTranscript: state.currentParsed.normalizedTranscript,
      parserVersion: state.currentParsed.parserVersion || '1.0.0',
      confidence: state.currentParsed.confidence,
      neededClarification: state.currentParsed.neededClarification || false,
      clarificationId: state.currentParsed.clarification ? state.currentParsed.clarification.id : '',
      process: state.currentParsed.process,
      processStage: state.currentParsed.processStage,
      errorType: state.currentParsed.errorType,
      legacyCode: state.currentParsed.legacyCode,
      detectedStage: state.currentParsed.detectedStage,
      drugName: state.currentParsed.extractedEntities && state.currentParsed.extractedEntities.drugs ? state.currentParsed.extractedEntities.drugs.join(', ') : '',
      actual: state.currentParsed.extractedEntities ? state.currentParsed.extractedEntities.actual : '',
      expected: state.currentParsed.extractedEntities ? state.currentParsed.extractedEntities.expected : '',
      catBEligible: true,
      patientReached: 'No',
      isLasa: (state.currentLasaActive || state.currentParsed.isLasa) ? 'Yes' : 'No',
      lasaType: (state.currentLasaActive || state.currentParsed.isLasa) ? (state.currentLasaType || state.currentParsed.lasaType || '') : '',
      lasaPrescribed: state.currentParsed.lasaPrescribed || (state.currentParsed.extractedEntities ? state.currentParsed.extractedEntities.expected : ''),
      lasaDispensed: state.currentParsed.lasaDispensed || (state.currentParsed.extractedEntities ? state.currentParsed.extractedEntities.actual : ''),
      lasaPairKey: state.currentParsed.lasaPairKey || '',
      tradeName: state.currentTradeName || state.currentParsed.tradeName || ''
    };

    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxcYrhDehjEu0lngU7o64v4ldrhYuXmfnJJnRyTt0x7d7GhK2SEb9G8z1SAWcKLVsGfCA/exec';

    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          state.isSaving = false;
          if (res && res.success) {
            handleSaveSuccess(res.recordId, payload);
          } else {
            alert('ไม่สามารถบันทึกได้: ' + (res ? res.error : 'Unknown error'));
            if (saveBtn) {
              saveBtn.disabled = false;
              saveBtn.innerHTML = '<span>บันทึก (Save)</span><span>✓</span>';
            }
          }
        })
        .withFailureHandler(function(err) {
          state.isSaving = false;
          alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + (err.message || err));
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<span>บันทึก (Save)</span><span>✓</span>';
          }
        })
        .apiSaveQuickReport(payload);
    } else {
      // External Frontend (e.g. GitHub Pages) HTTP POST via text/plain to bypass CORS
      fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      })
      .then(function() {
        state.isSaving = false;
        const recordId = 'web-' + Date.now().toString(36);
        handleSaveSuccess(recordId, payload);
      })
      .catch(function(err) {
        state.isSaving = false;
        console.warn('Network save fallback:', err);
        const recordId = 'local-' + Date.now().toString(36);
        handleSaveSuccess(recordId, payload);
      });
    }
  }

  /**
   * Handles successful save event and displays success screen.
   */
  function handleSaveSuccess(recordId, payload) {
    document.getElementById('success-record-id').innerText = recordId;
    document.getElementById('success-risk-code').innerText = payload.legacyCode || 'Cat B';
    document.getElementById('success-timestamp').innerText = new Date().toLocaleTimeString('th-TH');

    // Save locally for device recent reports
    addRecentReport({
      recordId: recordId,
      time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
      legacyCode: payload.legacyCode || 'Cat B',
      errorType: payload.errorType,
      drugName: payload.drugName
    });

    state.currentParsed = null;
    showScreen('screen-success');
  }

  /**
   * Manages recent reports stored locally on this device.
   */
  function addRecentReport(report) {
    let recent = [];
    try {
      recent = JSON.parse(localStorage.getItem(STORAGE_KEYS.RECENT_REPORTS) || '[]');
    } catch (e) {}
    recent.unshift(report);
    if (recent.length > 10) recent = recent.slice(0, 10);
    localStorage.setItem(STORAGE_KEYS.RECENT_REPORTS, JSON.stringify(recent));
    renderRecentReports();
  }

  function renderRecentReports() {
    let recent = [];
    try {
      recent = JSON.parse(localStorage.getItem(STORAGE_KEYS.RECENT_REPORTS) || '[]');
    } catch (e) {}

    const badge = document.getElementById('recent-count-badge');
    const list = document.getElementById('recent-reports-list');
    if (!list) return;

    if (badge) badge.innerText = recent.length;

    if (recent.length === 0) {
      list.innerHTML = '<div style="font-size: 13px; color: var(--color-text-muted); text-align: center; padding: 10px 0;">ยังไม่มีรายการที่บันทึกวันนี้</div>';
      return;
    }

    list.innerHTML = '';
    recent.slice(0, 5).forEach(function(item) {
      const itemEl = document.createElement('div');
      itemEl.style.cssText = 'background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;';
      itemEl.innerHTML = `
        <div>
          <div style="font-size: 14px; font-weight: 700; color: var(--color-text-primary);">${item.errorType || item.legacyCode}</div>
          <div style="font-size: 12px; color: var(--color-text-secondary);">${item.drugName || '-'}</div>
        </div>
        <div style="text-align: right;">
          <span style="font-size: 13px; font-weight: 800; color: var(--color-primary-dark);">${item.legacyCode}</span>
          <div style="font-size: 11px; color: var(--color-text-muted);">${item.time || ''}</div>
        </div>
      `;
      list.appendChild(itemEl);
    });
  }

  function loadRemoteRecentReports() {
    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(remoteReports) {
          if (remoteReports && remoteReports.length > 0) {
            const formatted = remoteReports.map(function(r) {
              return {
                recordId: r.recordId,
                time: new Date(r.createdAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                legacyCode: r.legacyCode,
                errorType: r.errorType,
                drugName: r.drugName
              };
            });
            localStorage.setItem(STORAGE_KEYS.RECENT_REPORTS, JSON.stringify(formatted));
            renderRecentReports();
          }
        })
        .apiGetRecentReports(state.deviceId, 5);
    }
  }

  /**
   * Shows a specific screen and manages header back button.
   */
  function showScreen(screenId) {
    const screens = [
      'screen-first-use',
      'screen-quick-report',
      'screen-recording',
      'screen-processing',
      'screen-confirmation',
      'screen-clarification',
      'screen-success'
    ];

    screens.forEach(function(id) {
      const el = document.getElementById(id);
      if (el) {
        if (id === screenId) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      }
    });

    const backBtn = document.getElementById('header-back-btn');
    if (backBtn) {
      if (screenId === 'screen-confirmation' || screenId === 'screen-clarification') {
        backBtn.classList.remove('hidden');
      } else {
        backBtn.classList.add('hidden');
      }
    }
  }

  function renderPresets() {
    const list = document.getElementById('quick-presets-list');

    if (!list) return;

    if (titleEl) {
      titleEl.innerText = 'รายการพบบ่อย (' + state.mode + ')';

    if (presets.length === 0) {
      list.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 14px; font-size: 12px; color: var(--color-text-secondary); background: #FFF0F3; border-radius: 12px; border: 1px dashed #FFB3C6;">ยังไม่มีปุ่มลัดที่เปิดใช้งาน แตะ <strong>⚙️ ปรับแต่ง</strong> เพื่อเลือกรายการ</div>';

      btn.innerHTML = `

  function getPresetsForCurrentMode() {
    const key = 'catchme_presets_' + state.mode;
    const stored = localStorage.getItem(key);
    if (stored) {
      try {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed;
        }
      } catch (e) {}
    }
    return JSON.parse(JSON.stringify(DEFAULT_PRESETS_CONFIG[state.mode] || DEFAULT_PRESETS_CONFIG.OPD));
  }

  function savePresetsForCurrentMode(presets) {
    const key = 'catchme_presets_' + state.mode;
    localStorage.setItem(key, JSON.stringify(presets));
    renderPresets();
  }

  /**
   * Submits quick preset form and routes to confirmation screen.
   */
  function submitQuickPresetForm() {
    if (!state.currentPreset) return;

    const drug = (document.getElementById('preset-drug-input').value || '').trim();
    const actual = (document.getElementById('preset-actual-input').value || '').trim();
    const expected = (document.getElementById('preset-expected-input').value || '').trim();
    const stage = document.getElementById('preset-stage-select').value || 'DS04';

    const preset = state.currentPreset;
    const stageMeta = DETECTED_STAGES_DICT[stage];

    const transcript = [
      preset.process === 'Pre-dispensing' ? 'คนจัดยา' : (preset.process === 'Prescribing' ? 'หมอสั่ง' : 'ห้องยา'),
      drug ? drug : '',
      actual ? ('จัดจริง ' + actual) : '',
      expected ? ('แต่ต้อง ' + expected) : '',
      stageMeta ? stageMeta.nameTh : ''
    ].filter(Boolean).join(' ');

    const parsed = {
      rawTranscript: transcript,
      normalizedTranscript: transcript,
      catBEligible: true,
      patientReached: 'No',
      safetyStopReason: '',
      legacyCode: preset.code,
      errorType: preset.errorType || (RISK_CODES_DICT[preset.code] ? RISK_CODES_DICT[preset.code].nameTh : 'Medication Error'),
      process: preset.process,
      processStage: preset.processStage,
      detectedStage: stage,
      detectedStageName: stageMeta ? stageMeta.nameTh : '',
      confidence: 'High',
      mode: state.mode,
      extractedEntities: {
        drugs: drug ? [drug] : [],
        actual: actual,
        expected: expected
      }
    };

    if (state.presetSelectedLasa) {
      parsed.isLasa = true;
      parsed.lasaType = state.presetSelectedLasa.lasaType;
      parsed.lasaPrescribed = state.presetSelectedLasa.prescribed;
      parsed.lasaDispensed = state.presetSelectedLasa.dispensed;
      parsed.lasaPairKey = state.presetSelectedLasa.pairKey;
      state.presetSelectedLasa = null;
    } else if (preset.code === 'B26') {
      parsed.isLasa = true;
      parsed.lasaType = 'Look-alike';
    }

    closeModal('modal-quick-preset-form');
    handleParsedResult(parsed);
  }

  function renderCustomizeList() {
    const container = document.getElementById('customize-presets-list');

    const presets = getPresetsForCurrentMode();
    container.innerHTML = '';

    presets.forEach(function(item) {
      const row = document.createElement('div');
      row.className = 'custom-preset-row' + (item.disabled ? ' disabled' : '');
      const isChecked = !item.disabled;

      row.innerHTML = `
        <div class="custom-preset-info">
          <input type="checkbox" class="custom-preset-toggle" ${isChecked ? 'checked' : ''} onchange="CatchME.togglePresetActive('${item.key}')" title="เปิด/ปิดการแสดงผลบนหน้าหลัก">
          <span style="font-size: 20px;">${item.icon || '⚡'}</span>
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 13px; font-weight: 700; color: var(--color-text-primary); display: flex; align-items: center; gap: 6px;">
              <span>${item.title}</span>
              <span class="preset-badge" style="font-size: 10px; padding: 1px 5px;">${item.code}</span>
            </div>
            <div style="font-size: 11px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
              ${item.desc || item.errorType || ''}
            </div>
          </div>
        </div>
        ${item.isCustom ? `<button type="button" class="custom-preset-del-btn" onclick="CatchME.deleteCustomPreset('${item.key}')" title="ลบปุ่มลัดนี้">🗑️</button>` : ''}
      `;
      container.appendChild(row);
    });
  }

  function togglePresetActive(presetKey) {
    const presets = getPresetsForCurrentMode();
    const item = presets.find(function(p) { return p.key === presetKey; });
    if (item) {
      item.disabled = !item.disabled;
      savePresetsForCurrentMode(presets);
      renderCustomizeList();
    }
  }

  function toggleAddPresetForm() {
    const addForm = document.getElementById('add-preset-form');
    if (addForm) {
      addForm.classList.toggle('hidden');
      if (!addForm.classList.contains('hidden')) {
        addForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
  }

  function onNewPresetCodeChange() {
    const codeSelect = document.getElementById('new-preset-code');
    if (!codeSelect) return;
    const code = codeSelect.value;
    const meta = RISK_CODES_DICT[code];
    if (!meta) return;

    const titleInput = document.getElementById('new-preset-title');
    const descInput = document.getElementById('new-preset-desc');
    const iconInput = document.getElementById('new-preset-icon');

    if (titleInput && (!titleInput.value || titleInput.dataset.autofilled)) {
      titleInput.value = meta.nameTh;
      titleInput.dataset.autofilled = 'true';
    }
    if (descInput && (!descInput.value || descInput.dataset.autofilled)) {
      descInput.value = meta.desc;
      descInput.dataset.autofilled = 'true';
    }
    if (iconInput) {
      iconInput.value = meta.group === 'B' ? '📦' : (meta.group === 'A' ? '⚠️' : '📋');
    }
  }

  function saveNewCustomPreset() {
    const codeSelect = document.getElementById('new-preset-code');
    const titleInput = document.getElementById('new-preset-title');
    const descInput = document.getElementById('new-preset-desc');
    const iconInput = document.getElementById('new-preset-icon');
    const drugInput = document.getElementById('new-preset-drug');
    const actualInput = document.getElementById('new-preset-actual');
    const expectedInput = document.getElementById('new-preset-expected');

    const code = codeSelect ? codeSelect.value : 'B29';
    const title = titleInput ? titleInput.value.trim() : '';
    if (!title) {
      alert('กรุณาระบุชื่อปุ่มที่แสดง');
      if (titleInput) titleInput.focus();
      return;
    }

    const meta = RISK_CODES_DICT[code] || { process: 'Pre-dispensing', nameTh: title };
    const desc = descInput ? descInput.value.trim() : meta.desc;
    const icon = (iconInput && iconInput.value.trim()) ? iconInput.value.trim() : '⚡';
    const drug = drugInput ? drugInput.value.trim() : '';
    const actual = actualInput ? actualInput.value.trim() : '';
    const expected = expectedInput ? expectedInput.value.trim() : '';

    const newPreset = {
      key: 'custom_' + Date.now().toString(36),
      isCustom: true,
      code: code,
      icon: icon,
      title: title,
      desc: desc,
      errorType: meta.nameTh,
      process: meta.process,
      processStage: meta.process === 'Prescribing' ? 'PS01' : (meta.process === 'Transcribing' ? 'PS07' : 'PS04'),
      defaultStage: meta.process === 'Prescribing' ? 'DS01' : 'DS04',
      defaultDrug: drug,
      defaultActual: actual,
      defaultExpected: expected,
      disabled: false
    };

    const presets = getPresetsForCurrentMode();
    presets.push(newPreset);
    savePresetsForCurrentMode(presets);

    // Reset inputs
    if (titleInput) { titleInput.value = ''; delete titleInput.dataset.autofilled; }
    if (descInput) { descInput.value = ''; delete descInput.dataset.autofilled; }
    if (drugInput) drugInput.value = '';
    if (actualInput) actualInput.value = '';
    if (expectedInput) expectedInput.value = '';

    const addForm = document.getElementById('add-preset-form');
    if (addForm) addForm.classList.add('hidden');

    renderCustomizeList();
  }

  function deleteCustomPreset(presetKey) {
    if (!confirm('ต้องการลบปุ่มลัดนี้ใช่หรือไม่?')) return;
    let presets = getPresetsForCurrentMode();
    presets = presets.filter(function(p) { return p.key !== presetKey; });
    savePresetsForCurrentMode(presets);
    renderCustomizeList();
  }

  function resetPresetsToDefault() {
    if (!confirm('ต้องการคืนค่ารายการพบบ่อยเป็นค่าเริ่มต้นของระบบใช่หรือไม่?')) return;
    localStorage.removeItem('catchme_presets_' + state.mode);
    renderPresets();
    renderCustomizeList();
  }

  /**
   * Code Dictionary Modal Logic.
   */
  function openCodeDictionary(tab, highlightCode) {
    renderCodeDictionary();
    if (tab === 'risk') {
      switchDictTab('risk');
    } else {
      switchDictTab('stage');
    }
    openModal('modal-code-dictionary');

    if (highlightCode) {
      setTimeout(function() {
        const target = document.getElementById('dict-item-' + highlightCode);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('highlight');
          setTimeout(function() { target.classList.remove('highlight'); }, 2000);
        }
      }, 200);
    }
  }

  function switchDictTab(tab) {
    const tabStage = document.getElementById('dict-tab-stage');
    const tabRisk = document.getElementById('dict-tab-risk');
    const contentStage = document.getElementById('dict-content-stage');
    const contentRisk = document.getElementById('dict-content-risk');

    if (tab === 'risk') {
      if (tabRisk) tabRisk.classList.add('active');
      if (tabStage) tabStage.classList.remove('active');
      if (contentRisk) contentRisk.classList.remove('hidden');
      if (contentStage) contentStage.classList.add('hidden');
    } else {
      if (tabStage) tabStage.classList.add('active');
      if (tabRisk) tabRisk.classList.remove('active');
      if (contentStage) contentStage.classList.remove('hidden');
      if (contentRisk) contentRisk.classList.add('hidden');
    }
  }

  function renderCodeDictionary() {
    // 1. Render DS Codes
    const stageContainer = document.getElementById('dict-content-stage');
    if (stageContainer && stageContainer.children.length === 0) {
      stageContainer.innerHTML = '';
      Object.keys(DETECTED_STAGES_DICT).forEach(function(code) {
        const item = DETECTED_STAGES_DICT[code];
        const el = document.createElement('div');
        el.id = 'dict-item-' + code;
        el.className = 'dict-item';
        el.innerHTML = `
          <div class="dict-item-header">
            <span class="dict-code stage">${item.code}</span>
            <span class="dict-item-name">${item.nameTh}</span>
          </div>
          <div class="dict-item-desc">${item.desc}</div>
          <div class="dict-item-en">${item.name}</div>
        `;
        stageContainer.appendChild(el);
      });
    }

    // 2. Render Risk Codes
    const riskContainer = document.getElementById('dict-content-risk');
    if (riskContainer && riskContainer.children.length === 0) {
      riskContainer.innerHTML = '';
      Object.keys(RISK_CODES_DICT).forEach(function(code) {
        const item = RISK_CODES_DICT[code];
        const badgeClass = item.group === 'B' ? 'risk-b' : (item.group === 'A' ? 'risk-a' : 'risk-e');
        const el = document.createElement('div');
        el.id = 'dict-item-' + code;
        el.className = 'dict-item';
        el.innerHTML = `
          <div class="dict-item-header">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span class="dict-code ${badgeClass}">${item.code}</span>
              <span style="font-size: 11px; font-weight: 700; color: var(--color-text-secondary);">${item.process}</span>
            </div>
            <span class="dict-item-name">${item.nameTh}</span>
          </div>
          <div class="dict-item-desc">${item.desc}</div>
        `;
        riskContainer.appendChild(el);
      });
    }
  }

  function explainCurrentRiskCode() {
    const code = state.currentParsed ? state.currentParsed.legacyCode : 'B29';
    openCodeDictionary('risk', code);
  }

  function explainCurrentStage() {
    const code = state.currentParsed ? state.currentParsed.detectedStage : 'DS04';
    openCodeDictionary('stage', code);
  }

  function selectEditRiskCode(code) {
    const input = document.getElementById('edit-risk-code');
    if (input) input.value = code;
  }

  function appendFallbackText(phrase) {
    const textarea = document.getElementById('fallback-text-input');
    if (textarea) {
      textarea.value = (textarea.value || '') + phrase;
      textarea.focus();
    }
  }

  return {
    init: init,
    toggleMode: toggleMode,
    selectInitialMode: selectInitialMode,
    saveInitialSetup: saveInitialSetup,
    openSettings: openSettings,
    openApiKeySetting: openApiKeySetting,
    startSpeechCapture: startSpeechCapture,
    stopSpeechCapture: stopSpeechCapture,
    cancelSpeechCapture: cancelSpeechCapture,
    openTextFallback: openTextFallback,
    submitTextFallback: submitTextFallback,
    openMinimalEdit: openMinimalEdit,
    applyMinimalEdit: applyMinimalEdit,
    saveReport: saveReport,
    skipClarification: skipClarification,
    handleRedirectToIncident: handleRedirectToIncident,
    goHome: goHome,
    openModal: openModal,
    closeModal: closeModal,
    renderPresets: renderPresets,
    openPresetForm: openPresetForm,
    setPresetDrug: setPresetDrug,
    setPresetActual: setPresetActual,
    setPresetExpected: setPresetExpected,
    submitQuickPresetForm: submitQuickPresetForm,
    openCodeDictionary: openCodeDictionary,
    switchDictTab: switchDictTab,
    explainCurrentRiskCode: explainCurrentRiskCode,
    explainCurrentStage: explainCurrentStage,
    selectEditRiskCode: selectEditRiskCode,
    appendFallbackText: appendFallbackText,
    openCustomizeModal: openCustomizeModal,
    togglePresetActive: togglePresetActive,
    toggleAddPresetForm: toggleAddPresetForm,
    onNewPresetCodeChange: onNewPresetCodeChange,
    saveNewCustomPreset: saveNewCustomPreset,
    deleteCustomPreset: deleteCustomPreset,
    resetPresetsToDefault: resetPresetsToDefault,
    toggleLasaActive: toggleLasaActive,
    selectLasaType: selectLasaType,
    updateTradeName: updateTradeName,
    onEditLasaToggle: onEditLasaToggle,
    setPresetLasaPair: setPresetLasaPair,
    renderPresetLasaChips: renderPresetLasaChips,
    openEmergingLasaModal: openEmergingLasaModal,
    setEmergingFilter: setEmergingFilter,
    promoteEmergingItem: promoteEmergingItem,
    promoteCurrentEmergingPair: promoteCurrentEmergingPair
  };
})();

window.addEventListener('DOMContentLoaded', function() {
  CatchME.init();
});
</script>
