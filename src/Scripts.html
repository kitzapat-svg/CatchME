<script>
/**
 * CatchME Client-side Controller (Milestone 2 - Web Speech API & End-to-End Quick Report)
 */
const CatchME = (function() {
  const STORAGE_KEYS = {
    MODE: 'catchmeMode',
    ALIAS: 'catchmeReporterAlias',
    DEVICE_ID: 'catchmeDeviceId',
    RECENT_REPORTS: 'catchmeRecentReports'
  };

  const DEFAULT_GEMINI_KEY = (function() {
    try {
      return atob('QVEuQWI4Uk42SW9mNEtCQzhWUmQ4d1Q2TW83bVNLcjdualZBeVpZVkEwbFVKUmsxaFRuYkE=');
    } catch (e) {
      return '';
    }
  })();

  const GEMINI_CONFIG = {
    getApiKey: function() {
      return localStorage.getItem('catchme_gemini_api_key') || DEFAULT_GEMINI_KEY;
    },
    setApiKey: function(key) {
      if (key && key.trim()) {
        localStorage.setItem('catchme_gemini_api_key', key.trim());
      } else if (key === '') {
        localStorage.removeItem('catchme_gemini_api_key');
      }
    },
    endpoint: function(apiKey) {
      return 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=' + apiKey;
    },
    model: 'gemini-flash-lite-latest'
  };

  const GEMINI_CLINICAL_PROMPT = `คุณคือระบบวิเคราะห์ความคลาดเคลื่อนทางยา (Medication Error) โรงพยาบาล สำหรับหมวด Category B (Near Miss: ตรวจพบและแก้ไขก่อนถึงตัวผู้ป่วยเท่านั้น)
จงวิเคราะห์ข้อความหรือเสียงรายงานนี้ แล้วตอบเป็น JSON ตามโครงสร้างนี้เท่านั้น:
{
  "transcript": "ข้อความที่พูดหรือได้รับภาษาไทย (สะกดชื่อยาภาษาอังกฤษให้ถูกต้องตามหลักสากล เช่น Metoprolol, Amlodipine, Tramadol)",
  "drug": "ชื่อยาหลัก (Generic name ภาษาอังกฤษ เช่น Metoprolol หากไม่มีให้ใส่ '-')",
  "actual": "จัดจริง/สั่งจริง เช่น ครึ่งเม็ด 2 ส่วน หรือ 10 mg",
  "expected": "ควรเป็น เช่น ครึ่งเม็ด 3 ส่วน หรือ 5 mg",
  "legacyCode": "รหัสความเสี่ยง เช่น B29, B26, A05, A01, A07, A16, B30, B28 (ถ้าจัดไม่ครบ/ขาด/เกิน ให้ใช้ B29)",
  "errorType": "ประเภทความคลาดเคลื่อน เช่น ผิดจำนวน/ปริมาณ, ผิดชนิดยา, ผิดความแรง, ยาตกหล่น/ไม่ครบรายการ",
  "process": "Pre-dispensing หรือ Prescribing หรือ Transcribing",
  "detectedStage": "DS01, DS02, หรือ DS04 (DS02 คือขั้นตอนจัดยา/ตรวจสอบยาก่อนส่งมอบ)",
  "patientReached": "No หรือ Yes (หากพบว่ายาถึงตัวผู้ป่วย ผู้ป่วยกินยาแล้ว หรือส่งมอบยาให้ผู้ป่วยไปแล้ว ให้เป็น Yes)",
  "catBEligible": true,
  "safetyStopReason": ""
}`;


  let state = {
    mode: 'OPD',
    alias: '',
    deviceId: '',
    currentParsed: null,
    isRecording: false,
    isSaving: false,
    mediaRecorder: null,
    audioStream: null,
    audioChunks: [],
    recognition: null,
    capturedTranscript: ''
  };

  /**
   * Initializes local state, speech recognition, and preferences.
   */
  function init() {
    ensureDeviceId();
    loadPreferences();
    initSpeechRecognition();

    const storedMode = localStorage.getItem(STORAGE_KEYS.MODE);
    if (!storedMode) {
      showScreen('screen-first-use');
    } else {
      updateHeaderUI();
      renderRecentReports();
      showScreen('screen-quick-report');
    }

    // Ping backend to check version and connectivity
    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(serverState) {
          console.log('CatchME Backend Connected:', serverState);
        })
        .withFailureHandler(function(err) {
          console.warn('Backend connection notice:', err);
        })
        .getInitialAppState(state.deviceId);

      // Load remote recent reports
      loadRemoteRecentReports();
    }
  }

  /**
   * Generates or retrieves a persistent pseudo-random UUID for this device.
   */
  function ensureDeviceId() {
    let id = localStorage.getItem(STORAGE_KEYS.DEVICE_ID);
    if (!id) {
      if (window.crypto && crypto.randomUUID) {
        id = crypto.randomUUID();
      } else {
        id = 'dev-' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
      }
      localStorage.setItem(STORAGE_KEYS.DEVICE_ID, id);
    }
    state.deviceId = id;
  }

  /**
   * Loads saved preferences from localStorage.
   */
  function loadPreferences() {
    state.mode = localStorage.getItem(STORAGE_KEYS.MODE) || 'OPD';
    state.alias = localStorage.getItem(STORAGE_KEYS.ALIAS) || '';
  }

  /**
   * Factory to create a fresh SpeechRecognition instance for clean lifecycle.
   */
  function createSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return null;

    try {
      const recognition = new SpeechRecognition();
      recognition.lang = 'th-TH';
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      recognition.continuous = false;

      recognition.onstart = function() {
        state.isRecording = true;
        state.capturedTranscript = '';
        showScreen('screen-recording');
        const preview = document.getElementById('live-transcript-preview');
        if (preview) {
          preview.innerHTML = '<span style="color: var(--color-primary-dark); font-weight: 600;">กำลังฟัง... (พูดได้เลย)</span>';
        }
      };

      recognition.onresult = function(event) {
        let interim = '';
        let final = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }

        const currentText = final || interim;
        if (currentText) {
          state.capturedTranscript = currentText;
          const preview = document.getElementById('live-transcript-preview');
          if (preview) {
            preview.innerText = '"' + currentText + '"';
          }
        }
      };

      recognition.onerror = function(event) {
        console.warn('Speech recognition error:', event.error);
        state.isRecording = false;
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          alert('ไมโครโฟนยังไม่ได้รับอนุญาต:\n1. คลิกไอคอนแม่กุญแจ 🔒 (หรือการตั้งค่าสิทธิ์) ข้างแถบ URL ด้านบน\n2. ไปที่ "สิทธิ์" (Permissions) > เลือก "อนุญาตไมโครโฟน" (Allow Microphone)\nหรือคลิกปุ่ม "พิมพ์ข้อความแทน" ได้ทันทีครับ');
          openTextFallback();
        } else if (event.error === 'audio-capture') {
          alert('ไม่พบอุปกรณ์ไมโครโฟนในเครื่องนี้ (No Microphone Found):\nกรุณาเสียบหูฟัง Smalltalk, ไมค์ USB หรือตรวจสอบการตั้งค่า Microphone ใน Windows\n\nระบบจะเปิดกล่องพิมพ์ข้อความแทนให้ครับ');
          openTextFallback();
        } else if (event.error === 'no-speech') {
          showScreen('screen-quick-report');
        } else {
          showScreen('screen-quick-report');
        }
      };

      recognition.onend = function() {
        state.isRecording = false;
        if (state.capturedTranscript && state.capturedTranscript.trim()) {
          showScreen('screen-processing');
          setTimeout(function() {
            processTranscript(state.capturedTranscript.trim());
          }, 300);
        } else {
          showScreen('screen-quick-report');
        }
      };

      return recognition;
    } catch (e) {
      console.warn('Failed to construct SpeechRecognition:', e);
      return null;
    }
  }

  function initSpeechRecognition() {
    // Initial check for feature availability
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      console.warn('Web Speech API is not supported in this browser.');
    }
  }

  /**
   * Safe ArrayBuffer to Base64 conversion without call-stack overflow.
   */
  function arrayBufferToBase64(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      const chunk = bytes.subarray(i, i + chunkSize);
      binary += String.fromCharCode.apply(null, chunk);
    }
    return btoa(binary);
  }

  /**
   * Resamples any audio blob into standard 16kHz mono WAV for optimal Gemini AI ingestion.
   */
  async function blobToWavBase64(blob) {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        const arrayBuffer = await blob.arrayBuffer();
        const audioCtx = new AudioContextClass();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const targetSampleRate = 16000;
        const numChannels = 1;
        const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(
          numChannels,
          Math.ceil(audioBuffer.duration * targetSampleRate),
          targetSampleRate
        );
        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(offlineCtx.destination);
        source.start(0);
        const renderedBuffer = await offlineCtx.startRendering();

        const pcmData = renderedBuffer.getChannelData(0);
        const wavBuffer = new ArrayBuffer(44 + pcmData.length * 2);
        const view = new DataView(wavBuffer);

        function writeString(view, offset, string) {
          for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
          }
        }

        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + pcmData.length * 2, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); // PCM
        view.setUint16(22, 1, true); // Mono
        view.setUint32(24, targetSampleRate, true);
        view.setUint32(28, targetSampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, 'data');
        view.setUint32(40, pcmData.length * 2, true);

        let offset = 44;
        for (let i = 0; i < pcmData.length; i++, offset += 2) {
          let s = Math.max(-1, Math.min(1, pcmData[i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }

        return {
          base64: arrayBufferToBase64(wavBuffer),
          mimeType: 'audio/wav'
        };
      }
    } catch (err) {
      console.warn('WAV conversion fallback triggered:', err);
    }

    // Direct fallback
    const rawBase64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    return {
      base64: rawBase64,
      mimeType: blob.type || 'audio/webm'
    };
  }

  /**
   * Sends audio to Google Gemini Flash API for multimodal transcription and Cat B analysis.
   */
  async function sendAudioToGemini(base64Audio, mimeType) {
    const apiKey = GEMINI_CONFIG.getApiKey();
    if (!apiKey) throw new Error('ไม่พบ Google Gemini API Key');

    const response = await fetch(GEMINI_CONFIG.endpoint(apiKey), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        contents: [{
          parts: [
            {
              inlineData: {
                mimeType: mimeType || 'audio/wav',
                data: base64Audio
              }
            },
            {
              text: GEMINI_CLINICAL_PROMPT
            }
          ]
        }],
        generationConfig: {
          responseMimeType: 'application/json',
          temperature: 0.1
        }
      })
    });

    if (!response.ok) {
      const errJson = await response.json().catch(function() { return {}; });
      const errMsg = (errJson.error && errJson.error.message) || ('HTTP ' + response.status);
      throw new Error(errMsg);
    }

    const data = await response.json();
    let resText = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0].text;
    if (!resText) throw new Error('Gemini ไม่ส่งคำตอบกลับมา');
    resText = resText.replace(/```json/gi, '').replace(/```/g, '').trim();
    return JSON.parse(resText);
  }

  /**
   * Sends text prompt to Google Gemini Flash API for Cat B medication error analysis.
   */
  async function sendTextToGemini(text) {
    const apiKey = GEMINI_CONFIG.getApiKey();
    if (!apiKey) throw new Error('ไม่พบ Google Gemini API Key');

    const response = await fetch(GEMINI_CONFIG.endpoint(apiKey), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        contents: [{
          parts: [
            {
              text: GEMINI_CLINICAL_PROMPT + '\n\nข้อความรายงาน: ' + text
            }
          ]
        }],
        generationConfig: {
          responseMimeType: 'application/json',
          temperature: 0.1
        }
      })
    });

    if (!response.ok) {
      const errJson = await response.json().catch(function() { return {}; });
      const errMsg = (errJson.error && errJson.error.message) || ('HTTP ' + response.status);
      throw new Error(errMsg);
    }

    const data = await response.json();
    let resText = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0].text;
    if (!resText) throw new Error('Gemini ไม่ส่งคำตอบกลับมา');
    resText = resText.replace(/```json/gi, '').replace(/```/g, '').trim();
    return JSON.parse(resText);
  }

  /**
   * Converts structured Gemini response into standard CatchME parsed object.
   */
  function convertGeminiToParsed(geminiData, fallbackText) {
    const transcript = geminiData.transcript || fallbackText || '';
    const isCatB = geminiData.catBEligible !== false && geminiData.patientReached !== 'Yes';
    return {
      rawTranscript: transcript,
      normalizedTranscript: transcript,
      catBEligible: isCatB,
      patientReached: geminiData.patientReached || (isCatB ? 'No' : 'Yes'),
      safetyStopReason: geminiData.safetyStopReason || (!isCatB ? 'ยาอาจถึงตัวผู้ป่วยแล้ว ไม่เข้าข่าย Category B (Near Miss)' : ''),
      legacyCode: geminiData.legacyCode || 'B29',
      errorType: geminiData.errorType || 'Medication Error',
      process: geminiData.process || 'Pre-dispensing',
      processStage: geminiData.process === 'Prescribing' ? 'PS01' : (geminiData.process === 'Transcribing' ? 'PS07' : 'PS04'),
      detectedStage: geminiData.detectedStage || 'DS02',
      detectedStageName: geminiData.detectedStage === 'DS01' ? 'ขั้นตอนตรวจความถูกต้องคำสั่งใช้ยา' : (geminiData.detectedStage === 'DS04' ? 'ขั้นตอนจัดยา' : 'ขั้นตอนจัด/ตรวจสอบยาก่อนส่งมอบ'),
      confidence: 'High',
      mode: state.mode || 'OPD',
      extractedEntities: {
        drugs: (geminiData.drug && geminiData.drug !== '-' && geminiData.drug !== 'ไม่ระบุ') ? [geminiData.drug] : [],
        actual: geminiData.actual && geminiData.actual !== '-' ? geminiData.actual : '',
        expected: geminiData.expected && geminiData.expected !== '-' ? geminiData.expected : ''
      }
    };
  }

  /**
   * Starts high-fidelity audio recording for Google Gemini Flash AI.
   */
  async function startSpeechCapture() {
    let apiKey = GEMINI_CONFIG.getApiKey();
    if (!apiKey) {
      const inputKey = prompt('🔑 เพื่อเปิดใช้งาน Google Gemini Flash AI\nกรุณาวาง Gemini API Key ของคุณที่นี่ (ตั้งค่าครั้งเดียว):', '');
      if (!inputKey || !inputKey.trim()) {
        openTextFallback();
        return;
      }
      GEMINI_CONFIG.setApiKey(inputKey.trim());
      apiKey = inputKey.trim();
    }

    const isInIframe = window.self !== window.top;
    if (isInIframe) {
      alert('ไมโครโฟนถูกจำกัดใน iframe ของ Google Apps Script\n\nกรุณาเปิดผ่านลิงก์ GitHub Pages เพื่อใช้งาน Gemini Flash ได้เต็มรูปแบบครับ:\nhttps://kitzapat-svg.github.io/CatchME/');
      openTextFallback();
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('เบราว์เซอร์นี้ไม่รองรับการเข้าถึงไมโครโฟน (MediaDevices)\nกำลังเปิดกล่องพิมพ์ข้อความแทนให้ครับ');
      openTextFallback();
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.audioStream = stream;

      let mimeType = '';
      if (typeof MediaRecorder !== 'undefined') {
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mimeType = 'audio/webm;codecs=opus';
        else if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
        else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
      }

      state.mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      state.audioChunks = [];
      state.isRecording = true;

      state.mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) {
          state.audioChunks.push(e.data);
        }
      };

      state.mediaRecorder.onstart = function() {
        showScreen('screen-recording');
        const preview = document.getElementById('live-transcript-preview');
        if (preview) {
          preview.innerHTML = '<span style="color: var(--color-primary-dark); font-weight: 600;">กำลังบันทึกเสียง... เมื่อพูดจบแตะปุ่ม "เสร็จสิ้น"</span>';
        }
      };

      state.mediaRecorder.onstop = async function() {
        state.isRecording = false;
        if (state.audioStream) {
          state.audioStream.getTracks().forEach(function(track) { track.stop(); });
          state.audioStream = null;
        }

        if (!state.audioChunks || state.audioChunks.length === 0) {
          showScreen('screen-quick-report');
          return;
        }

        const blobType = (state.mediaRecorder && state.mediaRecorder.mimeType) || 'audio/webm';
        const audioBlob = new Blob(state.audioChunks, { type: blobType });

        showScreen('screen-processing');
        const procTitle = document.getElementById('processing-title');
        const procSub = document.getElementById('processing-subtext');
        if (procTitle) procTitle.innerText = '⚡ Google Gemini Flash กำลังประมวลผล...';
        if (procSub) procSub.innerText = 'ฟังเสียง ถอดความชื่อยาภาษาอังกฤษ และวิเคราะห์รหัสความเสี่ยง';

        try {
          const { base64, mimeType } = await blobToWavBase64(audioBlob);
          const geminiData = await sendAudioToGemini(base64, mimeType);
          if (geminiData && (geminiData.transcript || geminiData.legacyCode)) {
            state.capturedTranscript = geminiData.transcript || '';
            const parsed = convertGeminiToParsed(geminiData, state.capturedTranscript);
            handleParsedResult(parsed);
          } else {
            alert('ไม่สามารถประมวลผลเสียงได้ กรุณาลองใหม่อีกครั้งครับ');
            showScreen('screen-quick-report');
          }
        } catch (err) {
          console.error('Gemini Audio error:', err);
          alert('Gemini AI Error: ' + err.message + '\n\nระบบจะเปิดกล่องพิมพ์ข้อความแทนให้ครับ');
          openTextFallback();
        }
      };

      state.mediaRecorder.start(200);

    } catch (err) {
      console.warn('Microphone capture error:', err);
      state.isRecording = false;
      if (state.audioStream) {
        state.audioStream.getTracks().forEach(function(track) { track.stop(); });
        state.audioStream = null;
      }

      if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
        alert('ไม่พบอุปกรณ์ไมโครโฟนในเครื่องนี้:\nกรุณาเสียบหูฟัง Smalltalk, ไมค์ USB หรือตรวจสอบการตั้งค่า Microphone ใน Windows');
      } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        alert('ไมโครโฟนยังไม่ได้รับอนุญาต:\n1. คลิกไอคอนแม่กุญแจ 🔒 ที่แถบ URL ด้านบน\n2. ไปที่ "สิทธิ์" (Permissions) > เลือก "อนุญาตไมโครโฟน" (Allow Microphone)');
      } else {
        alert('ไม่สามารถเปิดไมโครโฟนได้ (' + err.name + ': ' + err.message + ')');
      }
      openTextFallback();
    }
  }

  /**
   * Stops recording manually and triggers Google Gemini Flash transcription.
   */
  function stopSpeechCapture() {
    if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
      try {
        state.mediaRecorder.stop();
      } catch (e) {
        console.warn('Error stopping MediaRecorder:', e);
      }
    }
  }

  /**
   * Cancels recording and returns to home.
   */
  function cancelSpeechCapture() {
    state.capturedTranscript = '';
    state.isRecording = false;
    if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
      try {
        state.mediaRecorder.onstop = null;
        state.mediaRecorder.stop();
      } catch (e) {}
    }
    if (state.audioStream) {
      try {
        state.audioStream.getTracks().forEach(function(t) { t.stop(); });
      } catch (e) {}
      state.audioStream = null;
    }
    state.audioChunks = [];
    showScreen('screen-quick-report');
  }

  /**
   * Processes the transcript using Google Gemini Flash (with Regex Parser fallback).
   */
  async function processTranscript(text) {
    if (!text || !text.trim()) {
      showScreen('screen-quick-report');
      return;
    }

    showScreen('screen-processing');
    const procTitle = document.getElementById('processing-title');
    const procSub = document.getElementById('processing-subtext');
    if (procTitle) procTitle.innerText = '⚡ Google Gemini Flash กำลังวิเคราะห์...';
    if (procSub) procSub.innerText = 'วิเคราะห์ชื่อยาภาษาอังกฤษและจำแนกรหัสความเสี่ยงอย่างแม่นยำ';

    // 1. Primary: Google Gemini Flash AI (Clinical Understanding)
    try {
      const geminiData = await sendTextToGemini(text.trim());
      if (geminiData && (geminiData.legacyCode || geminiData.drug)) {
        state.capturedTranscript = geminiData.transcript || text.trim();
        const parsed = convertGeminiToParsed(geminiData, text.trim());
        handleParsedResult(parsed);
        return;
      }
    } catch (err) {
      console.warn('Gemini text analysis error, falling back to local regex parser:', err);
    }

    // 2. Secondary Fallback: Client-side Regex Parser (Offline capable)
    if (typeof parseMedicationError === 'function') {
      try {
        const parsed = parseMedicationError(text, state.mode);
        handleParsedResult(parsed);
        return;
      } catch (e) {
        console.warn('Client parser error, attempting server fallback:', e);
      }
    }

    // 3. Tertiary Fallback: Server-side via google.script.run
    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(parsed) {
          handleParsedResult(parsed);
        })
        .withFailureHandler(function(err) {
          alert('เกิดข้อผิดพลาดในการวิเคราะห์: ' + (err.message || err));
          showScreen('screen-quick-report');
        })
        .apiParseMedicationError(text, state.mode);
    } else {
      alert('ไม่พบระบบวิเคราะห์ กรุณาลองใหม่อีกครั้ง');
      showScreen('screen-quick-report');
    }
  }

  /**
   * Routes the parsed result to the appropriate screen.
   */
  function handleParsedResult(parsed) {
    state.currentParsed = parsed;

    // 1. Safety Gate Check (Hard Stop)
    if (!parsed.catBEligible || parsed.patientReached === 'Yes') {
      const reasonEl = document.getElementById('hardstop-reason');
      if (reasonEl) {
        reasonEl.innerText = parsed.safetyStopReason || 'พบสัญญาณว่ายาอาจถึงตัวผู้ป่วยแล้ว';
      }
      openModal('modal-catb-hardstop');
      showScreen('screen-quick-report');
      return;
    }

    // 2. Clarification Check
    if (parsed.requiresClarification && parsed.clarification) {
      renderClarificationScreen(parsed);
      showScreen('screen-clarification');
      return;
    }

    // 3. Normal Confirmation Screen
    renderConfirmationScreen(parsed);
    showScreen('screen-confirmation');
  }

  /**
   * Renders the Confirmation Card UI.
   */
  function renderConfirmationScreen(parsed) {
    document.getElementById('confirm-risk-code').innerText = parsed.legacyCode || 'Cat B';
    document.getElementById('confirm-error-type').innerText = parsed.errorType || 'Medication Error';
    
    // Medications
    let drugs = '-';
    if (parsed.extractedEntities && parsed.extractedEntities.drugs && parsed.extractedEntities.drugs.length > 0) {
      drugs = parsed.extractedEntities.drugs.join(', ');
    }
    document.getElementById('confirm-drug-name').innerText = drugs;

    // Process & Stage
    document.getElementById('confirm-process-stage').innerText = (parsed.process || '') + (parsed.processStage ? ' (' + parsed.processStage + ')' : '');

    // Detail: Actual vs Expected
    const detailLabel = document.getElementById('confirm-detail-label');
    const actualSpan = document.getElementById('confirm-actual');
    const expectedSpan = document.getElementById('confirm-expected');
    const detailSection = document.getElementById('confirm-detail-section');

    const actualVal = parsed.extractedEntities ? parsed.extractedEntities.actual : '';
    const expectedVal = parsed.extractedEntities ? parsed.extractedEntities.expected : '';

    if (actualVal || expectedVal) {
      detailSection.classList.remove('hidden');
      detailLabel.innerText = parsed.errorType || 'รายละเอียด';
      actualSpan.innerText = 'จัดจริง/สั่งจริง: ' + (actualVal || '-');
      expectedSpan.innerText = 'ควรเป็น: ' + (expectedVal || '-');
    } else {
      detailLabel.innerText = parsed.errorType || 'รายละเอียด';
      actualSpan.innerText = 'โหมด: ' + parsed.mode;
      expectedSpan.innerText = 'ความมั่นใจ: ' + parsed.confidence;
    }

    // Detected stage
    document.getElementById('confirm-detected-stage').innerText = (parsed.detectedStage || 'DS01') + ' — ' + (parsed.detectedStageName || 'ตรวจพบก่อนถึงผู้ป่วย');

    // Raw transcript
    document.getElementById('confirm-raw-transcript').innerText = '"' + (parsed.rawTranscript || '') + '"';

    // Reset save button state
    const saveBtn = document.getElementById('btn-save-report');
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<span>บันทึก (Save)</span><span>✓</span>';
    }
  }

  /**
   * Renders the Clarification Screen with Bento Grid options.
   */
  function renderClarificationScreen(parsed) {
    const titleEl = document.getElementById('clarification-question-title');
    const subEl = document.getElementById('clarification-question-sub');
    const gridEl = document.getElementById('clarification-options-grid');

    const clarify = parsed.clarification;
    titleEl.innerText = clarify.question || 'ต้องการข้อมูลเพิ่มเติม';
    subEl.innerText = 'แตะเลือก 1 คำตอบเพื่อจำแนกรหัสความเสี่ยงที่ถูกต้อง';
    gridEl.innerHTML = '';

    const choices = clarify.choices || [];
    choices.forEach(function(choiceText) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bento-card-btn';
      btn.innerHTML = `
        <div>
          <div class="bento-card-title">${choiceText}</div>
          <div class="bento-card-sub">แตะเพื่อระบุขั้นตอนนี้</div>
        </div>
        <span style="font-size: 20px; color: var(--color-primary);">→</span>
      `;
      btn.onclick = function() {
        resolveClarification(choiceText);
      };
      gridEl.appendChild(btn);
    });
  }

  /**
   * Resolves clarification answer and transitions to Confirmation.
   */
  function resolveClarification(choiceText) {
    if (!state.currentParsed) return;

    // Apply specific code mappings from clarification choices
    if (choiceText.indexOf('A10') !== -1 || choiceText.indexOf('แพทย์สั่ง') !== -1) {
      state.currentParsed.legacyCode = 'A10';
      state.currentParsed.process = 'Prescribing';
      state.currentParsed.processStage = 'PS01';
      state.currentParsed.errorType = 'ผิดจำนวน/ปริมาณ';
      state.currentParsed.detectedStage = 'DS01';
    } else if (choiceText.indexOf('B08') !== -1 || choiceText.indexOf('ห้องยาคีย์') !== -1) {
      state.currentParsed.legacyCode = 'B08';
      state.currentParsed.process = 'Pre-dispensing';
      state.currentParsed.processStage = 'PS02';
      state.currentParsed.errorType = 'ผิดจำนวน/ปริมาณ';
      state.currentParsed.detectedStage = 'DS02';
    } else if (choiceText.indexOf('B29') !== -1 || choiceText.indexOf('คนจัดยา') !== -1) {
      state.currentParsed.legacyCode = 'B29';
      state.currentParsed.process = 'Pre-dispensing';
      state.currentParsed.processStage = 'PS04';
      state.currentParsed.errorType = 'ผิดจำนวน/ปริมาณ';
      state.currentParsed.detectedStage = 'DS04';
    } else if (choiceText.indexOf('B22') !== -1 || choiceText.indexOf('ไม่ได้รับคำสั่ง STAT') !== -1) {
      state.currentParsed.legacyCode = 'B22';
      state.currentParsed.process = 'Pre-dispensing';
      state.currentParsed.processStage = 'PS03';
      state.currentParsed.errorType = 'ตกหล่นคำสั่ง STAT/ด่วน';
      state.currentParsed.detectedStage = 'DS05';
    } else if (choiceText.indexOf('E11') !== -1 || choiceText.indexOf('ไม่ได้ติดป้าย STAT') !== -1) {
      state.currentParsed.legacyCode = 'E11';
      state.currentParsed.process = 'Transcribing';
      state.currentParsed.processStage = 'PS07';
      state.currentParsed.errorType = 'ตกหล่นคำสั่ง STAT/ด่วน';
      state.currentParsed.detectedStage = 'DS05';
    } else if (choiceText.indexOf('B25') !== -1 || choiceText.indexOf('ทั้งชุด') !== -1) {
      state.currentParsed.legacyCode = 'B25';
      state.currentParsed.process = 'Pre-dispensing';
      state.currentParsed.processStage = 'PS04';
      state.currentParsed.errorType = 'ผิดผู้ป่วย';
      state.currentParsed.detectedStage = 'DS04';
    } else if (choiceText.indexOf('B34') !== -1 || choiceText.indexOf('ปนบางรายการ') !== -1) {
      state.currentParsed.legacyCode = 'B34';
      state.currentParsed.process = 'Pre-dispensing';
      state.currentParsed.processStage = 'PS04';
      state.currentParsed.errorType = 'ผิดผู้ป่วย';
      state.currentParsed.detectedStage = 'DS04';
    }

    state.currentParsed.confidence = 'High';
    state.currentParsed.neededClarification = true;
    renderConfirmationScreen(state.currentParsed);
    showScreen('screen-confirmation');
  }

  /**
   * Skips clarification question.
   */
  function skipClarification() {
    if (state.currentParsed) {
      renderConfirmationScreen(state.currentParsed);
      showScreen('screen-confirmation');
    } else {
      showScreen('screen-quick-report');
    }
  }

  /**
   * Opens minimal edit modal.
   */
  function openMinimalEdit() {
    if (!state.currentParsed) return;
    document.getElementById('edit-risk-code').value = state.currentParsed.legacyCode || '';
    
    let drugs = '';
    if (state.currentParsed.extractedEntities && state.currentParsed.extractedEntities.drugs) {
      drugs = state.currentParsed.extractedEntities.drugs.join(', ');
    }
    document.getElementById('edit-drug-name').value = drugs;
    document.getElementById('edit-actual').value = state.currentParsed.extractedEntities ? state.currentParsed.extractedEntities.actual : '';
    document.getElementById('edit-expected').value = state.currentParsed.extractedEntities ? state.currentParsed.extractedEntities.expected : '';

    openModal('modal-minimal-edit');

  /**
   * Applies minimal edit changes.
   */
  function applyMinimalEdit() {
    if (!state.currentParsed) return;
    const newCode = document.getElementById('edit-risk-code').value.trim();
    const newDrug = document.getElementById('edit-drug-name').value.trim();
    const newActual = document.getElementById('edit-actual').value.trim();
    const newExpected = document.getElementById('edit-expected').value.trim();

    if (newCode) state.currentParsed.legacyCode = newCode;
    if (!state.currentParsed.extractedEntities) state.currentParsed.extractedEntities = {};
    if (newDrug) state.currentParsed.extractedEntities.drugs = [newDrug];
    state.currentParsed.extractedEntities.actual = newActual;
    state.currentParsed.extractedEntities.expected = newExpected;

    closeModal('modal-minimal-edit');
    renderConfirmationScreen(state.currentParsed);
  }

  /**
   * Saves the confirmed report to Google Sheets or local mock.
   */
  function saveReport() {
    if (state.isSaving || !state.currentParsed) return;
    state.isSaving = true;

    const saveBtn = document.getElementById('btn-save-report');
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span>กำลังบันทึก...</span>';
    }

    const payload = {
      deviceSessionId: state.deviceId,
      reporterAlias: state.alias || 'Anon',
      mode: state.mode,
      rawTranscript: state.currentParsed.rawTranscript,
      normalizedTranscript: state.currentParsed.normalizedTranscript,
      parserVersion: state.currentParsed.parserVersion || '1.0.0',
      confidence: state.currentParsed.confidence,
      neededClarification: state.currentParsed.neededClarification || false,
      clarificationId: state.currentParsed.clarification ? state.currentParsed.clarification.id : '',
      process: state.currentParsed.process,
      processStage: state.currentParsed.processStage,
      errorType: state.currentParsed.errorType,
      legacyCode: state.currentParsed.legacyCode,
      detectedStage: state.currentParsed.detectedStage,
      drugName: state.currentParsed.extractedEntities && state.currentParsed.extractedEntities.drugs ? state.currentParsed.extractedEntities.drugs.join(', ') : '',
      actual: state.currentParsed.extractedEntities ? state.currentParsed.extractedEntities.actual : '',
      expected: state.currentParsed.extractedEntities ? state.currentParsed.extractedEntities.expected : '',
      catBEligible: true,
      patientReached: 'No'
    };

    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzG1lOIkSlisc14ofAW0Ev49EgtMgmtvaJ0LCf353BNX_tzhx38in5P_HvxlOhmH7Cf_w/exec';

    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          state.isSaving = false;
          if (res && res.success) {
            handleSaveSuccess(res.recordId, payload);
          } else {
            alert('ไม่สามารถบันทึกได้: ' + (res ? res.error : 'Unknown error'));
            if (saveBtn) {
              saveBtn.disabled = false;
              saveBtn.innerHTML = '<span>บันทึก (Save)</span><span>✓</span>';
            }
          }
        })
        .withFailureHandler(function(err) {
          state.isSaving = false;
          alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + (err.message || err));
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<span>บันทึก (Save)</span><span>✓</span>';
          }
        })
        .apiSaveQuickReport(payload);
    } else {
      // External Frontend (e.g. GitHub Pages) HTTP POST via text/plain to bypass CORS
      fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      })
      .then(function() {
        state.isSaving = false;
        const recordId = 'web-' + Date.now().toString(36);
        handleSaveSuccess(recordId, payload);
      })
      .catch(function(err) {
        state.isSaving = false;
        console.warn('Network save fallback:', err);
        const recordId = 'local-' + Date.now().toString(36);
        handleSaveSuccess(recordId, payload);
      });
    }
  }

  /**
   * Handles successful save event and displays success screen.
   */
  function handleSaveSuccess(recordId, payload) {
    document.getElementById('success-record-id').innerText = recordId;
    document.getElementById('success-risk-code').innerText = payload.legacyCode || 'Cat B';
    document.getElementById('success-timestamp').innerText = new Date().toLocaleTimeString('th-TH');

    // Save locally for device recent reports
    addRecentReport({
      recordId: recordId,
      time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
      legacyCode: payload.legacyCode || 'Cat B',
      errorType: payload.errorType,
      drugName: payload.drugName
    });

    state.currentParsed = null;
    showScreen('screen-success');
  }

  /**
   * Manages recent reports stored locally on this device.
   */
  function addRecentReport(report) {
    let recent = [];
    try {
      recent = JSON.parse(localStorage.getItem(STORAGE_KEYS.RECENT_REPORTS) || '[]');
    } catch (e) {}
    recent.unshift(report);
    if (recent.length > 10) recent = recent.slice(0, 10);
    localStorage.setItem(STORAGE_KEYS.RECENT_REPORTS, JSON.stringify(recent));
    renderRecentReports();
  }

  function renderRecentReports() {
    let recent = [];
    try {
      recent = JSON.parse(localStorage.getItem(STORAGE_KEYS.RECENT_REPORTS) || '[]');
    } catch (e) {}

    const badge = document.getElementById('recent-count-badge');
    const list = document.getElementById('recent-reports-list');
    if (!list) return;

    if (badge) badge.innerText = recent.length;

    if (recent.length === 0) {
      list.innerHTML = '<div style="font-size: 13px; color: var(--color-text-muted); text-align: center; padding: 10px 0;">ยังไม่มีรายการที่บันทึกวันนี้</div>';
      return;
    }

    list.innerHTML = '';
    recent.slice(0, 5).forEach(function(item) {
      const itemEl = document.createElement('div');
      itemEl.style.cssText = 'background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;';
      itemEl.innerHTML = `
        <div>
          <div style="font-size: 14px; font-weight: 700; color: var(--color-text-primary);">${item.errorType || item.legacyCode}</div>
          <div style="font-size: 12px; color: var(--color-text-secondary);">${item.drugName || '-'}</div>
        </div>
        <div style="text-align: right;">
          <span style="font-size: 13px; font-weight: 800; color: var(--color-primary-dark);">${item.legacyCode}</span>
          <div style="font-size: 11px; color: var(--color-text-muted);">${item.time || ''}</div>
        </div>
      `;
      list.appendChild(itemEl);
    });
  }

  function loadRemoteRecentReports() {
    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(remoteReports) {
          if (remoteReports && remoteReports.length > 0) {
            const formatted = remoteReports.map(function(r) {
              return {
                recordId: r.recordId,
                time: new Date(r.createdAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                legacyCode: r.legacyCode,
                errorType: r.errorType,
                drugName: r.drugName
              };
            });
            localStorage.setItem(STORAGE_KEYS.RECENT_REPORTS, JSON.stringify(formatted));
            renderRecentReports();
          }
        })
        .apiGetRecentReports(state.deviceId, 5);
    }
  }

  /**
   * Text Fallback Modal handlers.
   */
  function openTextFallback() {
    document.getElementById('fallback-text-input').value = '';
    openModal('modal-text-fallback');
  }

  function submitTextFallback() {
    const text = document.getElementById('fallback-text-input').value.trim();
    if (!text) {
      alert('กรุณากรอกข้อความ');
      return;
    }
    closeModal('modal-text-fallback');

    }, 200);

  /**
   * Redirects user to hospital incident system (Hard stop).
   */
  function handleRedirectToIncident() {
    alert('กำลังนำคุณไปยังระบบรายงานอุบัติการณ์ความเสี่ยงโรงพยาบาล...');
    closeModal('modal-catb-hardstop');
    goHome();
  }

  /**
   * Navigates back to Quick Report home.
   */
  function goHome() {
    state.currentParsed = null;
    showScreen('screen-quick-report');
  }

  /**
   * Shows a specific screen and manages header back button.
   */
  function showScreen(screenId) {
    const screens = [
      'screen-first-use',
      'screen-quick-report',
      'screen-recording',
      'screen-processing',
      'screen-confirmation',
      'screen-clarification',
      'screen-success'
    ];

    screens.forEach(function(id) {
      const el = document.getElementById(id);
      if (el) {
        if (id === screenId) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      }
    });

    const backBtn = document.getElementById('header-back-btn');
    if (backBtn) {
      if (screenId === 'screen-confirmation' || screenId === 'screen-clarification') {
        backBtn.classList.remove('hidden');
      } else {
        backBtn.classList.add('hidden');
      }
    }
  }

  /**
   * Modal helper functions.
   */
  function openModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) el.classList.remove('hidden');
  }

  function closeModal(modalId) {
    const el = document.getElementById(modalId);
    if (el) el.classList.add('hidden');
  }

  /**
   * Toggles mode between OPD and IPD.
   */
  function toggleMode() {
    state.mode = (state.mode === 'OPD') ? 'IPD' : 'OPD';
    localStorage.setItem(STORAGE_KEYS.MODE, state.mode);
    updateHeaderUI();
  }

  /**
   * Updates header UI with current mode and alias.
   */
  function updateHeaderUI() {
    const modeBadge = document.getElementById('header-mode-badge');
    const modeText = document.getElementById('mode-text');
    const aliasText = document.getElementById('alias-text');

    if (modeBadge && modeText) {
      modeText.innerText = state.mode;
      if (state.mode === 'IPD') {
        modeBadge.className = 'mode-badge ipd';
      } else {
        modeBadge.className = 'mode-badge opd';
      }
    }

    if (aliasText) {
      aliasText.innerText = state.alias ? state.alias : 'Anon';
    }
  }

  /**
   * Handles first-use setup save.
   */
  function selectInitialMode(m) {
    state.mode = m;
    const opdCard = document.getElementById('select-opd-card');
    const ipdCard = document.getElementById('select-ipd-card');
    if (m === 'OPD') {
      opdCard.classList.add('selected');
      ipdCard.classList.remove('selected');
    } else {
      ipdCard.classList.add('selected');
      opdCard.classList.remove('selected');
    }
  }

  function saveInitialSetup() {
    const aliasInput = document.getElementById('setup-alias-input');
    const alias = aliasInput ? aliasInput.value.trim() : '';

    localStorage.setItem(STORAGE_KEYS.MODE, state.mode);
    localStorage.setItem(STORAGE_KEYS.ALIAS, alias);
    state.alias = alias;

    updateHeaderUI();
    showScreen('screen-quick-report');
  }

  function openSettings() {
    const current = state.alias || '';
    const updated = prompt('ระบุรหัสย่อผู้รายงาน (Reporter Alias):', current);
    if (updated !== null) {
      state.alias = updated.trim();
      localStorage.setItem(STORAGE_KEYS.ALIAS, state.alias);
      updateHeaderUI();
    }
  }

  function openApiKeySetting() {
    const currentKey = GEMINI_CONFIG.getApiKey();
    const isCustom = localStorage.getItem('catchme_gemini_api_key');
    const updated = prompt('🔑 ตั้งค่า Google Gemini API Key:\n(รับ Key ฟรีได้ที่ https://aistudio.google.com/app/apikey)\nปล่อยว่างแล้วกด OK หากต้องการคืนค่าเป็น Default Key', isCustom ? currentKey : '');
    if (updated !== null) {
      GEMINI_CONFIG.setApiKey(updated);
      alert(updated.trim() ? 'บันทึก Google Gemini API Key เรียบร้อยแล้วครับ!' : 'คืนค่าเป็น Default Gemini Key เรียบร้อยแล้ว');
    }
  }

  return {
    init: init,
    toggleMode: toggleMode,
    selectInitialMode: selectInitialMode,
